<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mesa de Control · Liga San Carlos</title>
  <link rel="icon" type="image/png" href="images/logo liga.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --red:#f80808; --blue:#3009dc; --gold:#f2b34e;
      --dark:#08090C; --dark2:#111318; --card:#161920;
      --text:#E8EAF0; --muted:#6B7280; --border:rgba(255,255,255,0.08);
      --green:#4ADE80;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overscroll-behavior:none;}

    /* ══ LOGIN ══ */
    #login-screen{position:fixed;inset:0;z-index:100;background:var(--dark);display:flex;align-items:center;justify-content:center;padding:20px;}
    #login-screen.hidden{display:none;}
    .login-box{width:100%;max-width:380px;background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:36px 28px;text-align:center;}
    .login-logo{height:60px;margin-bottom:14px;filter:drop-shadow(0 4px 18px rgba(0,0,0,.5));}
    .login-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;}
    .login-title span{color:var(--gold);}
    .login-sub{font-size:13px;color:var(--muted);margin:6px 0 26px;}
    .login-fg{margin-bottom:14px;text-align:left;}
    .login-label{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
    .login-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;padding:14px 14px;color:var(--text);font-size:16px;outline:none;}
    .login-input:focus{border-color:rgba(242,179,78,.5);}
    .login-err{font-size:12px;color:var(--red);min-height:16px;margin-bottom:10px;text-align:left;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
    .login-btn{width:100%;padding:16px;border-radius:6px;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;background:var(--red);color:#fff;cursor:pointer;margin-bottom:10px;}
    .login-btn:disabled{opacity:.6;}
    .login-back{display:inline-block;margin-top:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;color:var(--muted);text-decoration:none;}
    .shake{animation:shake .4s ease;}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

    /* ══ APP ══ */
    #app{display:none;min-height:100vh;flex-direction:column;}
    #app.visible{display:flex;}
    nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:rgba(8,9,12,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
    .nav-left{display:flex;align-items:center;gap:10px;min-width:0;}
    .nav-left img{height:28px;flex-shrink:0;}
    .nav-title{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nav-title span{color:var(--gold);}
    .nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .pill{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:6px 10px;border-radius:3px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;}
    .pill.primera{color:var(--red);border-color:rgba(248,8,8,.3);background:rgba(248,8,8,.1);}
    .pill.segunda{color:#8b7fef;border-color:rgba(48,9,220,.3);background:rgba(48,9,220,.1);}
    .logout-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:6px 10px;border-radius:3px;border:1px solid rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#F87171;cursor:pointer;}

    .view{flex:1;padding:16px;max-width:720px;width:100%;margin:0 auto;}
    .view[hidden]{display:none;}

    /* ── LISTA DE PARTIDOS ── */
    .section-lbl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .section-lbl:first-child{margin-top:4px;}
    .game-pick{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s;}
    .game-pick:hover{border-color:rgba(255,255,255,.25);}
    .game-pick.is-live{border-color:rgba(248,8,8,.45);}
    .gp-teams{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;}
    .gp-meta{font-size:12px;color:var(--muted);margin-top:3px;}
    .gp-tag{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;flex-shrink:0;}
    .gp-tag.live{color:var(--red);display:flex;align-items:center;gap:5px;}
    .gp-tag.upcoming{color:var(--gold);}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .empty-hint{padding:40px 16px;text-align:center;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:1px;}

    /* ── PANTALLA INICIAR ── */
    .start-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;text-align:center;}
    .start-teams{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;margin-bottom:4px;}
    .start-round{font-size:12px;color:var(--muted);margin-bottom:24px;}
    .period-choices{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;}
    .period-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:10px 16px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;}
    .period-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(242,179,78,.1);}
    .start-btn{width:100%;padding:18px;border-radius:8px;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:2px;text-transform:uppercase;background:var(--red);color:#fff;cursor:pointer;}
    .back-link{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;margin-bottom:16px;padding:8px 0;}

    /* ── TABLERO DE CONTROL ── */
    .board-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
    .board-round{font-size:12px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;}
    .finish-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:8px 14px;border-radius:4px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.1);color:#F87171;cursor:pointer;}

    .teams-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .team-panel{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--tc,var(--red));border-radius:10px;padding:16px 12px;text-align:center;}
    .tp-logo{width:44px;height:44px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;}
    .tp-logo img{width:100%;height:100%;object-fit:contain;}
    .tp-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.5px;min-height:34px;display:flex;align-items:center;justify-content:center;}
    .tp-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,14vw,72px);line-height:1;color:var(--text);margin:6px 0;}
    .tp-edit{font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-decoration:underline;margin-bottom:10px;}
    .tp-btns{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
    .score-btn{flex:1;min-width:44px;min-height:48px;border-radius:6px;border:none;font-family:'Bebas Neue',sans-serif;font-size:18px;cursor:pointer;background:rgba(255,255,255,.08);color:var(--text);transition:transform .08s;}
    .score-btn:active{transform:scale(.92);}
    .score-btn.plus{background:var(--gold);color:#000;}
    .score-btn.minus{background:rgba(248,113,113,.15);color:#F87171;flex:0 0 44px;}

    .fouls-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    .fouls-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .fouls-box.bonus{border-color:rgba(248,8,8,.5);background:rgba(248,8,8,.06);}
    .fouls-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
    .fouls-num{font-family:'Bebas Neue',sans-serif;font-size:28px;}
    .fouls-btns{display:flex;gap:6px;}
    .fouls-btn{width:34px;height:34px;border-radius:5px;border:none;background:rgba(255,255,255,.08);color:var(--text);font-size:16px;cursor:pointer;}

    .clock-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center;margin-bottom:16px;}
    .quarter-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
    .quarter-nav{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);cursor:pointer;font-size:16px;}
    .quarter-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);min-width:130px;}
    .clock-display{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,14vw,68px);letter-spacing:2px;line-height:1;margin-bottom:4px;}
    .clock-display.running{color:var(--green);}
    .clock-edit{font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-decoration:underline;margin-bottom:14px;}
    .clock-adjust{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
    .adj-btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;padding:8px 12px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);cursor:pointer;}
    .toggle-clock{width:100%;padding:16px;border-radius:8px;border:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
    .toggle-clock.play{background:var(--green);color:#000;}
    .toggle-clock.pause{background:var(--gold);color:#000;}

    .save-hint{text-align:center;font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;padding-bottom:20px;}

    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:12px 22px;border-radius:6px;transition:transform .3s;z-index:999;white-space:nowrap;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    .toast.err{background:#F87171;}

    @media(min-width:600px){
      .teams-board{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-box">
    <img src="images/logo liga.png" class="login-logo" alt="LSC" onerror="this.style.display='none'">
    <div class="login-title">Mesa de <span>Control</span></div>
    <div class="login-sub">Acceso de mesa · marcador en vivo</div>
    <div class="login-fg">
      <label class="login-label">Correo</label>
      <input class="login-input" type="email" id="login-email" autocomplete="username" oninput="clearErr()" />
    </div>
    <div class="login-fg">
      <label class="login-label">Contraseña</label>
      <input class="login-input" type="password" id="login-pwd" autocomplete="current-password" oninput="clearErr()"
        onkeydown="if(event.key==='Enter')submitLogin()" />
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" id="login-btn" onclick="submitLogin()">Entrar →</button>
    <a href="index.html" class="login-back">← Volver al sitio</a>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <nav>
    <div class="nav-left">
      <img src="images/logo liga.png" alt="LSC" onerror="this.style.display='none'">
      <div class="nav-title">Mesa de <span>Control</span></div>
    </div>
    <div class="nav-right">
      <button class="pill primera" id="div-pill" onclick="toggleDivision()">1° División</button>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </nav>

  <!-- LISTA -->
  <div id="view-list" class="view">
    <div id="live-section"></div>
    <div id="upcoming-section"></div>
  </div>

  <!-- INICIAR PARTIDO -->
  <div id="view-start" class="view" hidden>
    <button class="back-link" onclick="goToList()">← Elegir otro partido</button>
    <div class="start-card">
      <div class="start-teams" id="start-teams">— vs —</div>
      <div class="start-round" id="start-round">Jornada —</div>
      <div class="section-lbl" style="margin-top:0;border:none;">Duración por cuarto</div>
      <div class="period-choices" id="period-choices"></div>
      <button class="start-btn" onclick="startGame()">🔴 Iniciar partido en vivo</button>
    </div>
  </div>

  <!-- TABLERO -->
  <div id="view-board" class="view" hidden>
    <button class="back-link" onclick="goToList()">← Elegir otro partido</button>
    <div class="board-top">
      <div class="board-round" id="board-round">Jornada —</div>
      <button class="finish-btn" onclick="finishGame()">🏁 Finalizar partido</button>
    </div>

    <div class="teams-board">
      <div class="team-panel" id="home-panel">
        <div class="tp-logo" id="home-logo"></div>
        <div class="tp-name" id="home-name">—</div>
        <div class="tp-score" id="home-score">0</div>
        <button class="tp-edit" onclick="editScore('home')">✎ editar marcador</button>
        <div class="tp-btns">
          <button class="score-btn minus" onclick="adjustScore('home',-1)">−1</button>
          <button class="score-btn plus" onclick="adjustScore('home',1)">+1</button>
          <button class="score-btn plus" onclick="adjustScore('home',2)">+2</button>
          <button class="score-btn plus" onclick="adjustScore('home',3)">+3</button>
        </div>
      </div>
      <div class="team-panel" id="away-panel">
        <div class="tp-logo" id="away-logo"></div>
        <div class="tp-name" id="away-name">—</div>
        <div class="tp-score" id="away-score">0</div>
        <button class="tp-edit" onclick="editScore('away')">✎ editar marcador</button>
        <div class="tp-btns">
          <button class="score-btn minus" onclick="adjustScore('away',-1)">−1</button>
          <button class="score-btn plus" onclick="adjustScore('away',1)">+1</button>
          <button class="score-btn plus" onclick="adjustScore('away',2)">+2</button>
          <button class="score-btn plus" onclick="adjustScore('away',3)">+3</button>
        </div>
      </div>
    </div>

    <div class="clock-card">
      <div class="quarter-row">
        <button class="quarter-nav" onclick="changeQuarter(-1)">◀</button>
        <div class="quarter-label" id="quarter-label">CUARTO 1</div>
        <button class="quarter-nav" onclick="changeQuarter(1)">▶</button>
      </div>
      <div class="clock-display" id="clock-display">10:00</div>
      <button class="clock-edit" onclick="editClock()">✎ editar tiempo</button>
      <div class="clock-adjust">
        <button class="adj-btn" onclick="adjustClock(-60)">−1:00</button>
        <button class="adj-btn" onclick="adjustClock(-10)">−0:10</button>
        <button class="adj-btn" onclick="adjustClock(10)">+0:10</button>
        <button class="adj-btn" onclick="adjustClock(60)">+1:00</button>
        <button class="adj-btn" onclick="resetClock()">↺ Reiniciar</button>
      </div>
      <button class="toggle-clock play" id="toggle-clock-btn" onclick="toggleClock()">▶ Iniciar cronómetro</button>
    </div>

    <div class="fouls-row">
      <div class="fouls-box" id="home-fouls-box">
        <div>
          <div class="fouls-label">Faltas local</div>
          <div class="fouls-num" id="home-fouls-num">0</div>
        </div>
        <div class="fouls-btns">
          <button class="fouls-btn" onclick="adjustFouls('home',-1)">−</button>
          <button class="fouls-btn" onclick="adjustFouls('home',1)">+</button>
        </div>
      </div>
      <div class="fouls-box" id="away-fouls-box">
        <div>
          <div class="fouls-label">Faltas visita</div>
          <div class="fouls-num" id="away-fouls-num">0</div>
        </div>
        <div class="fouls-btns">
          <button class="fouls-btn" onclick="adjustFouls('away',-1)">−</button>
          <button class="fouls-btn" onclick="adjustFouls('away',1)">+</button>
        </div>
      </div>
    </div>

    <div class="save-hint">Los cambios se guardan automáticamente y se ven en vivo en la web · <a href="en-vivo.html" target="_blank" style="color:var(--gold);">Ver página en vivo →</a></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

const _supabase    = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let _session = null;

function isAdmin(){ return _session?.user?.id === ADMIN_UID; }

_supabase.auth.onAuthStateChange((event, session) => {
  _session = session;
  if (event === 'SIGNED_OUT') showLogin();
});

(async () => {
  const { data } = await _supabase.auth.getSession();
  _session = data.session;
  if (isAdmin()) showApp(); else showLogin();
})();

function showLogin(){
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('app').classList.remove('visible');
}
function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('visible');
  goToList();
}
function clearErr(){ document.getElementById('login-err').textContent=''; }

async function submitLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pwd   = document.getElementById('login-pwd').value;
  const btn   = document.getElementById('login-btn');
  const err   = document.getElementById('login-err');
  if (!email || !pwd){ err.textContent='Completa ambos campos'; shake(); return; }
  btn.disabled = true; btn.textContent = 'Verificando...';
  const { data, error } = await _supabase.auth.signInWithPassword({ email, password: pwd });
  if (error){
    btn.disabled = false; btn.textContent = 'Entrar →';
    err.textContent = 'Correo o contraseña incorrectos'; shake();
    return;
  }
  _session = data.session;
  if (!isAdmin()){
    await _supabase.auth.signOut(); _session = null;
    btn.disabled = false; btn.textContent = 'Entrar →';
    err.textContent = 'No tienes permisos de administrador'; shake();
    return;
  }
  showApp();
}
function shake(){
  const box = document.querySelector('.login-box');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
}
async function logout(){
  stopTicker();
  await _supabase.auth.signOut();
  _session = null;
  showLogin();
}

/* ══════════════════════════════════════════════════════════════
   ESTADO
══════════════════════════════════════════════════════════════ */
let activeDivision = 'primera';
let currentGame = null;       // fila cruda + campos derivados
let chosenPeriodMinutes = 10;
let tickerInterval = null;

const divCfg   = () => CONFIG.divisions[activeDivision];
const divTeams = () => divCfg().teams;

function toggleDivision(){
  activeDivision = activeDivision === 'primera' ? 'segunda' : 'primera';
  updateDivPill();
  goToList();
}
function updateDivPill(){
  const pill = document.getElementById('div-pill');
  pill.textContent = activeDivision === 'primera' ? '1° División' : '2° División';
  pill.className = `pill ${activeDivision}`;
}

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function rowToLive(row){
  return {
    id: row.id, type: row.type, round: row.round, date: row.date,
    venue: row.venue, home: row.home, away: row.away,
    homeScore: row.home_score || 0, awayScore: row.away_score || 0,
    quarter: row.quarter || 1,
    periodLen: row.period_length_seconds || 600,
    clockSeconds: row.clock_seconds ?? (row.period_length_seconds || 600),
    clockRunning: !!row.clock_running,
    clockStartedAt: row.clock_started_at,
    homeFouls: row.home_fouls || 0, awayFouls: row.away_fouls || 0,
  };
}

function teamLogoHTML(id){
  const t = divTeams()[id];
  if (!t) return '';
  return t.logo
    ? `<img src="${t.logo}" alt="${t.name}" onerror="this.parentElement.innerHTML='${t.abbr}'">`
    : t.abbr;
}

/* ══════════════════════════════════════════════════════════════
   VISTA: LISTA DE PARTIDOS
══════════════════════════════════════════════════════════════ */
function setView(id){
  ['view-list','view-start','view-board'].forEach(v => {
    document.getElementById(v).hidden = (v !== id);
  });
}

async function goToList(){
  stopTicker();
  currentGame = null;
  setView('view-list');
  updateDivPill();
  const { data, error } = await _supabase.from(divCfg().dbTable).select('*')
    .in('type', ['upcoming','live']).order('round', { ascending: true });
  if (error){ showToast('⚠ Error al conectar', true); return; }
  const games = (data || []).map(rowToLive);
  const teams = divTeams();
  const live = games.filter(g => g.type === 'live');
  const upcoming = games.filter(g => g.type === 'upcoming');

  const pickHTML = (g, isLive) => {
    const h = teams[g.home]?.name || g.home, a = teams[g.away]?.name || g.away;
    return `<div class="game-pick ${isLive?'is-live':''}" onclick="openGame(${g.id})">
      <div>
        <div class="gp-teams">${h} vs ${a}</div>
        <div class="gp-meta">Jornada ${g.round}${isLive ? ` · C${g.quarter} · ${g.homeScore}-${g.awayScore}` : ' · ' + (g.date||'Por definir')}</div>
      </div>
      <div class="gp-tag ${isLive?'live':'upcoming'}">${isLive?'<span class="live-dot"></span>EN VIVO':'⏳ PRÓXIMO'}</div>
    </div>`;
  };

  document.getElementById('live-section').innerHTML = live.length
    ? `<div class="section-lbl">🔴 En vivo ahora</div>${live.map(g=>pickHTML(g,true)).join('')}` : '';
  document.getElementById('upcoming-section').innerHTML = upcoming.length
    ? `<div class="section-lbl">Partidos disponibles para iniciar</div>${upcoming.map(g=>pickHTML(g,false)).join('')}`
    : (live.length ? '' : `<div class="empty-hint">No hay partidos próximos ni en vivo registrados.<br>Agrégalos primero en el Panel Admin.</div>`);
}

async function openGame(id){
  const { data, error } = await _supabase.from(divCfg().dbTable).select('*').eq('id', id).single();
  if (error || !data){ showToast('⚠ No se pudo cargar el partido', true); return; }
  currentGame = rowToLive(data);
  if (currentGame.type === 'live') openBoard();
  else openStart();
}

/* ══════════════════════════════════════════════════════════════
   VISTA: INICIAR PARTIDO
══════════════════════════════════════════════════════════════ */
function openStart(){
  setView('view-start');
  const teams = divTeams();
  document.getElementById('start-teams').textContent =
    `${teams[currentGame.home]?.name || currentGame.home} vs ${teams[currentGame.away]?.name || currentGame.away}`;
  document.getElementById('start-round').textContent = `Jornada ${currentGame.round}`;
  chosenPeriodMinutes = 10;
  renderPeriodChoices();
}
function renderPeriodChoices(){
  const opts = [8,10,12];
  document.getElementById('period-choices').innerHTML = opts.map(m =>
    `<button class="period-btn ${m===chosenPeriodMinutes?'active':''}" onclick="setPeriodMinutes(${m})">${m} min</button>`
  ).join('');
}
function setPeriodMinutes(m){ chosenPeriodMinutes = m; renderPeriodChoices(); }

async function startGame(){
  const seconds = chosenPeriodMinutes * 60;
  const payload = {
    type: 'live', quarter: 1,
    period_length_seconds: seconds, clock_seconds: seconds,
    clock_running: false, clock_started_at: null,
    home_score: 0, away_score: 0, home_fouls: 0, away_fouls: 0,
  };
  const { error } = await _supabase.from(divCfg().dbTable).update(payload).eq('id', currentGame.id);
  if (error){ showToast('⚠ Error: ' + error.message, true); return; }
  Object.assign(currentGame, {
    type:'live', quarter:1, periodLen:seconds, clockSeconds:seconds,
    clockRunning:false, clockStartedAt:null, homeScore:0, awayScore:0, homeFouls:0, awayFouls:0,
  });
  showToast('🔴 Partido iniciado en vivo');
  openBoard();
}

/* ══════════════════════════════════════════════════════════════
   VISTA: TABLERO DE CONTROL
══════════════════════════════════════════════════════════════ */
function openBoard(){
  setView('view-board');
  const teams = divTeams();
  const home = teams[currentGame.home], away = teams[currentGame.away];
  document.getElementById('board-round').textContent = `Jornada ${currentGame.round}`;
  document.getElementById('home-panel').style.setProperty('--tc', home?.color || '#f80808');
  document.getElementById('away-panel').style.setProperty('--tc', away?.color || '#3009dc');
  document.getElementById('home-logo').innerHTML = teamLogoHTML(currentGame.home);
  document.getElementById('away-logo').innerHTML = teamLogoHTML(currentGame.away);
  document.getElementById('home-name').textContent = home?.name || currentGame.home;
  document.getElementById('away-name').textContent = away?.name || currentGame.away;
  renderBoard();
  startTicker();
}

function renderBoard(){
  if (!currentGame) return;
  document.getElementById('home-score').textContent = currentGame.homeScore;
  document.getElementById('away-score').textContent = currentGame.awayScore;
  document.getElementById('home-fouls-num').textContent = currentGame.homeFouls;
  document.getElementById('away-fouls-num').textContent = currentGame.awayFouls;
  document.getElementById('home-fouls-box').classList.toggle('bonus', currentGame.homeFouls >= 5);
  document.getElementById('away-fouls-box').classList.toggle('bonus', currentGame.awayFouls >= 5);
  const q = currentGame.quarter;
  document.getElementById('quarter-label').textContent = q <= 4 ? `CUARTO ${q}` : (q === 5 ? 'TIEMPO EXTRA' : `TIEMPO EXTRA ${q-4}`);
  const btn = document.getElementById('toggle-clock-btn');
  btn.textContent = currentGame.clockRunning ? '⏸ Pausar cronómetro' : '▶ Iniciar cronómetro';
  btn.className = 'toggle-clock ' + (currentGame.clockRunning ? 'pause' : 'play');
  renderClock();
}

function remainingSeconds(){
  if (!currentGame.clockRunning || !currentGame.clockStartedAt) return currentGame.clockSeconds;
  const elapsed = (Date.now() - new Date(currentGame.clockStartedAt).getTime()) / 1000;
  return Math.max(0, currentGame.clockSeconds - elapsed);
}
function fmtClock(totalSeconds){
  const s = Math.ceil(totalSeconds);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function renderClock(){
  const disp = document.getElementById('clock-display');
  const remaining = remainingSeconds();
  disp.textContent = fmtClock(remaining);
  disp.classList.toggle('running', currentGame.clockRunning);
  if (currentGame.clockRunning && remaining <= 0) autoStopClock();
}
function startTicker(){
  stopTicker();
  tickerInterval = setInterval(renderClock, 250);
}
function stopTicker(){
  if (tickerInterval){ clearInterval(tickerInterval); tickerInterval = null; }
}

async function persist(fields){
  const { error } = await _supabase.from(divCfg().dbTable).update(fields).eq('id', currentGame.id);
  if (error) showToast('⚠ Error al guardar: ' + error.message, true);
}

/* ── MARCADOR ── */
async function adjustScore(side, delta){
  const key = side === 'home' ? 'homeScore' : 'awayScore';
  currentGame[key] = Math.max(0, currentGame[key] + delta);
  renderBoard();
  await persist({ [side === 'home' ? 'home_score' : 'away_score']: currentGame[key] });
}
function editScore(side){
  const key = side === 'home' ? 'homeScore' : 'awayScore';
  const val = prompt('Nuevo marcador:', currentGame[key]);
  if (val === null) return;
  const n = parseInt(val);
  if (isNaN(n) || n < 0) { showToast('⚠ Número inválido', true); return; }
  currentGame[key] = n;
  renderBoard();
  persist({ [side === 'home' ? 'home_score' : 'away_score']: n });
}

/* ── FALTAS ── */
async function adjustFouls(side, delta){
  const key = side === 'home' ? 'homeFouls' : 'awayFouls';
  currentGame[key] = Math.max(0, currentGame[key] + delta);
  renderBoard();
  await persist({ [side === 'home' ? 'home_fouls' : 'away_fouls']: currentGame[key] });
}

/* ── CUARTO ── */
async function changeQuarter(delta){
  const next = Math.max(1, currentGame.quarter + delta);
  if (next === currentGame.quarter) return;
  if (!confirm(`¿Cambiar a ${next <= 4 ? 'Cuarto ' + next : 'Tiempo Extra'}? Se reiniciará el cronómetro y las faltas de equipo.`)) return;
  currentGame.quarter = next;
  currentGame.clockSeconds = currentGame.periodLen;
  currentGame.clockRunning = false;
  currentGame.clockStartedAt = null;
  currentGame.homeFouls = 0;
  currentGame.awayFouls = 0;
  renderBoard();
  await persist({
    quarter: next, clock_seconds: currentGame.periodLen,
    clock_running: false, clock_started_at: null,
    home_fouls: 0, away_fouls: 0,
  });
  showToast('✓ Cuarto actualizado');
}

/* ── CRONÓMETRO ── */
async function toggleClock(){
  if (currentGame.clockRunning){
    currentGame.clockSeconds = remainingSeconds();
    currentGame.clockRunning = false;
    currentGame.clockStartedAt = null;
    renderBoard();
    await persist({ clock_seconds: Math.round(currentGame.clockSeconds), clock_running: false, clock_started_at: null });
  } else {
    if (currentGame.clockSeconds <= 0){ showToast('⚠ El cronómetro está en 00:00', true); return; }
    currentGame.clockStartedAt = new Date().toISOString();
    currentGame.clockRunning = true;
    renderBoard();
    await persist({ clock_running: true, clock_started_at: currentGame.clockStartedAt });
  }
}
async function autoStopClock(){
  currentGame.clockSeconds = 0;
  currentGame.clockRunning = false;
  currentGame.clockStartedAt = null;
  renderBoard();
  await persist({ clock_seconds: 0, clock_running: false, clock_started_at: null });
  showToast('⏱ Fin del tiempo');
}
async function adjustClock(deltaSeconds){
  if (currentGame.clockRunning){ showToast('⚠ Pausa el cronómetro para ajustarlo', true); return; }
  currentGame.clockSeconds = Math.max(0, currentGame.clockSeconds + deltaSeconds);
  renderBoard();
  await persist({ clock_seconds: Math.round(currentGame.clockSeconds) });
}
async function resetClock(){
  currentGame.clockSeconds = currentGame.periodLen;
  currentGame.clockRunning = false;
  currentGame.clockStartedAt = null;
  renderBoard();
  await persist({ clock_seconds: currentGame.periodLen, clock_running: false, clock_started_at: null });
}
function editClock(){
  if (currentGame.clockRunning){ showToast('⚠ Pausa el cronómetro para editarlo', true); return; }
  const val = prompt('Nuevo tiempo (mm:ss):', fmtClock(currentGame.clockSeconds));
  if (val === null) return;
  const m = val.match(/^(\d{1,2}):(\d{2})$/);
  if (!m){ showToast('⚠ Formato inválido, usa mm:ss', true); return; }
  const secs = (+m[1]) * 60 + (+m[2]);
  currentGame.clockSeconds = secs;
  renderBoard();
  persist({ clock_seconds: secs });
}

/* ── FINALIZAR ── */
async function finishGame(){
  if (!confirm('¿Finalizar este partido? El marcador quedará guardado como resultado final.\n\nPodrás agregar puntos por jugador y el MVP desde el Panel Admin.')) return;
  stopTicker();
  const { error } = await _supabase.from(divCfg().dbTable).update({
    type: 'finished', clock_running: false,
  }).eq('id', currentGame.id);
  if (error){ showToast('⚠ Error: ' + error.message, true); return; }
  showToast('✓ Partido finalizado');
  goToList();
}
</script>
