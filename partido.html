<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partido · Liga San Carlos</title>
  <link rel="icon" type="image/png" href="images/logo liga.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --red:#f80808; --blue:#3009dc; --gold:#f2b34e;
      --dark:#08090C; --dark2:#111318; --card:#161920;
      --text:#E8EAF0; --muted:#6B7280; --border:rgba(255,255,255,0.07);
      --green:#4ADE80;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");background-size:180px;pointer-events:none;opacity:0.6;}
    main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 60px;}

    nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 clamp(16px,4vw,32px);background:rgba(8,9,12,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .nav-logo img{height:30px;}
    .nav-logo-text{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;color:var(--text);}
    .nav-logo-text span{color:var(--red);}
    .nav-back{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 14px;border:1px solid var(--border);border-radius:4px;}
    .nav-back:hover{color:var(--text);border-color:rgba(255,255,255,.2);}

    .loading{padding:80px 20px;text-align:center;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:14px;}
    .empty-state{text-align:center;padding:80px 20px;color:var(--muted);}
    .empty-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text);margin-bottom:8px;}
    .empty-cta{display:inline-block;margin-top:16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;background:var(--red);color:#fff;padding:12px 24px;border-radius:4px;text-decoration:none;}

    /* ── HERO ── */
    .hero-bar{padding:28px 0 0;}
    .hero-eyebrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:18px;text-align:center;}
    .status-badge{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border-radius:3px;}
    .status-badge.live{color:var(--red);background:rgba(248,8,8,.1);border:1px solid rgba(248,8,8,.3);}
    .status-badge.finished{color:var(--green);background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);}
    .live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

    .status-row{display:flex;justify-content:center;margin-bottom:10px;}
    .hero-meta-line{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text);margin-bottom:20px;}

    .score-hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(10px,3vw,32px);padding:4px 0 20px;}
    .hero-team{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-width:0;}
    .score-hero.matchday .hero-team.home{align-items:flex-start;text-align:left;}
    .score-hero.matchday .hero-team.away{align-items:flex-end;text-align:right;}
    .hero-team-top{display:flex;align-items:center;gap:12px;}
    .hero-team-top.reverse{flex-direction:row-reverse;}
    .hero-team-id{min-width:0;}
    .hero-team-logo{width:clamp(48px,9vw,68px);height:clamp(48px,9vw,68px);flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.03);}
    .hero-team-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
    .hero-team-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(13px,2.1vw,18px);letter-spacing:.3px;line-height:1.15;}
    .hero-team-tag{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--tc,var(--muted));font-weight:700;margin-top:2px;}
    .hero-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,11vw,84px);line-height:1;}
    .hero-score.winner{color:var(--text);}
    .hero-score.loser{color:var(--muted);}
    .hero-score-bar{width:56px;height:3px;border-radius:3px;background:var(--tc,#666);box-shadow:0 0 14px var(--tc,#666);}
    .score-hero.matchday .hero-team.away .hero-score-bar{margin-left:auto;}

    /* ── FRAME HUD/BROADCAST POR EQUIPO (usa el color propio de cada equipo vía --tc) ── */
    .score-hero.matchday .hero-team{position:relative;isolation:isolate;padding:16px 20px 14px;}
    .score-hero.matchday .hero-team::before{
      content:"";position:absolute;inset:0;z-index:-1;
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--tc,#666) 16%, transparent) 0%, transparent 58%),
        color-mix(in srgb, var(--tc,#666) 4%, transparent);
      border:1px solid color-mix(in srgb, var(--tc,#666) 55%, transparent);
      clip-path:polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
      box-shadow:
        inset 0 0 0 1px color-mix(in srgb, var(--tc,#666) 18%, transparent),
        0 0 28px -10px color-mix(in srgb, var(--tc,#666) 95%, transparent);
    }
    .score-hero.matchday .hero-team.away::before{
      clip-path:polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    }
    .score-hero.matchday .hero-team::after{
      content:"";position:absolute;width:18px;height:18px;z-index:1;pointer-events:none;
      background:var(--tc,#666);
      filter:drop-shadow(0 0 5px color-mix(in srgb, var(--tc,#666) 80%, transparent));
    }
    .score-hero.matchday .hero-team.home::after{top:0;right:0;clip-path:polygon(100% 0, 100% 100%, 0 0);}
    .score-hero.matchday .hero-team.away::after{top:0;left:0;clip-path:polygon(0 0, 100% 0, 0 100%);}
    .score-hero.matchday .hero-team-logo{position:relative;background:rgba(0,0,0,.25);}
    .score-hero.matchday .hero-team-logo::before{
      content:"";position:absolute;inset:-5px;z-index:-1;
      border:1.5px solid color-mix(in srgb, var(--tc,#666) 70%, transparent);
      clip-path:polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      filter:drop-shadow(0 0 6px color-mix(in srgb, var(--tc,#666) 55%, transparent));
    }
    .score-hero.matchday .hero-score{text-shadow:0 0 24px color-mix(in srgb, var(--tc,#666) 55%, transparent);}
    .score-hero.matchday .hero-score.loser{text-shadow:none;}
    .score-hero.matchday .hero-score-bar{width:64px;height:4px;border-radius:0;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);}
    .score-hero.matchday .hero-team.away .hero-score-bar{clip-path:polygon(0 0,94% 0,100% 100%,6% 100%);}
    .hero-center{display:flex;flex-direction:column;align-items:center;gap:5px;}
    .hero-vs{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted);}
    .hero-meta{font-size:11px;color:var(--muted);text-align:center;letter-spacing:1px;}
    .hero-quarter{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;color:var(--text);text-transform:uppercase;}
    .hero-clock{font-family:'Bebas Neue',sans-serif;font-size:clamp(30px,6vw,42px);letter-spacing:1px;color:var(--text);}
    .hero-clock.paused{color:var(--muted);}
    .hero-fouls-line{text-align:center;font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:14px;}
    .hero-mvp{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;background:rgba(242,179,78,.07);border:1px solid rgba(242,179,78,.2);border-radius:8px;margin:16px auto 0;max-width:360px;}
    .hero-mvp-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
    .hero-mvp-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--gold);}

    /* ── TOP PERFORMERS ── */
    .section-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:28px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .stats-toggle{display:flex;gap:8px;margin:28px 0 16px;border-bottom:1px solid var(--border);}
    .stats-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px;}
    .stats-tab.active{color:var(--text);border-bottom-color:var(--gold);}
    #plays-panel[hidden],#stats-panel[hidden]{display:none;}
    .performers-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
    .performer-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;background:color-mix(in srgb, var(--pc,#666) 14%, var(--card));border-color:color-mix(in srgb, var(--pc,#666) 40%, var(--border));}
    .performer-num{font-family:'Bebas Neue',sans-serif;font-size:32px;color:color-mix(in srgb, var(--pc,#666) 65%, #fff);line-height:1;flex-shrink:0;}
    .performer-info{min-width:0;}
    .performer-rank{font-size:9px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
    .performer-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .performer-pts{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);}

    /* ── BOX SCORE ── */
    .boxscore-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .boxscore-team{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .boxscore-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:color-mix(in srgb, var(--tc,#666) 30%, var(--card));border-bottom:1px solid var(--border);}
    .boxscore-team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;}
    .boxscore-team-total{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);}
    .boxscore-colhead,.boxscore-row{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:6px;}
    .boxscore-colhead.with-court,.boxscore-row.with-court{grid-template-columns:1fr 44px 76px;}
    .boxscore-colhead{padding:7px 16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
    .boxscore-colhead span{text-align:center;}
    .boxscore-colhead span:first-child{text-align:left;}
    .boxscore-row{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);}
    .boxscore-row:last-child{border-bottom:none;}
    .boxscore-player{display:flex;align-items:center;gap:8px;min-width:0;}
    .boxscore-num{font-size:11px;color:var(--muted);min-width:20px;flex-shrink:0;}
    .boxscore-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .leader-badge{font-size:9px;background:rgba(242,179,78,.15);color:var(--gold);padding:2px 6px;border-radius:3px;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;font-weight:700;flex-shrink:0;}
    .boxscore-fouls{font-size:10px;color:#F87171;margin-right:4px;}
    .boxscore-pts-cell{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--gold);}
    .boxscore-court-cell{display:flex;align-items:center;justify-content:center;}
    .court-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
    .court-dot.on{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.6);}
    .court-dot.off{background:#3a3f4a;}
    .boxscore-empty{padding:20px;text-align:center;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;}
    .boxscore-legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:14px 4px 0;font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;}
    .boxscore-legend span{display:flex;align-items:center;gap:6px;}

    /* ── TIMELINE JUGADA A JUGADA ── */
    .timeline-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .timeline-item{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--card);font-size:13px;}
    .timeline-q{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;color:var(--muted);min-width:26px;flex-shrink:0;}
    .timeline-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .timeline-desc{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--text);min-width:0;}
    .timeline-desc b{font-weight:700;}
    .timeline-desc .team-tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:4px;}
    .timeline-score{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);flex-shrink:0;white-space:nowrap;}
    .timeline-empty{padding:20px;text-align:center;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;}

    /* ── PREVIA ── */
    .preview-compare{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .compare-head,.compare-row{display:grid;grid-template-columns:1fr minmax(110px,auto) 1fr;align-items:center;gap:10px;padding:11px 16px;}
    .compare-head{background:rgba(255,255,255,.03);border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;}
    .compare-head span:first-child,.compare-row .cv:first-child{text-align:left;}
    .compare-head span:last-child,.compare-row .cv:last-child{text-align:right;}
    .compare-row{border-bottom:1px solid rgba(255,255,255,.04);}
    .compare-row:last-child{border-bottom:none;}
    .compare-label{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
    .cv{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;color:var(--muted);}
    .cv.better{color:var(--gold);}
    .preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .preview-team{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .preview-team-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;background:color-mix(in srgb, var(--tc,#666) 30%, var(--card));border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;}
    .streak-text{font-size:11px;letter-spacing:1px;color:var(--text);opacity:.85;}
    .form-chips{display:flex;gap:6px;padding:14px 16px 4px;}
    .form-chip{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;}
    .form-chip.w{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.35);}
    .form-chip.l{background:rgba(248,113,113,.12);color:#F87171;border:1px solid rgba(248,113,113,.3);}
    .recent-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 16px;border-bottom:1px solid rgba(255,255,255,.04);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;text-decoration:none;color:var(--text);}
    .recent-row:last-child{border-bottom:none;}
    .recent-row:hover{background:rgba(255,255,255,.03);}
    .recent-res{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.5px;white-space:nowrap;}
    .recent-res.w{color:var(--green);}
    .recent-res.l{color:#F87171;}
    .recent-opp{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .recent-opp b{color:var(--text);font-weight:700;}
    .key-player{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.04);text-decoration:none;color:var(--text);}
    .key-player:last-child{border-bottom:none;}
    .key-player:hover{background:rgba(255,255,255,.03);}
    .key-num{font-size:11px;color:var(--muted);}
    .key-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .key-sub{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.5px;}
    .key-ppg{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);text-align:right;line-height:1;}
    .key-ppg small{display:block;font-family:'Barlow Condensed',sans-serif;font-size:9px;letter-spacing:1px;color:var(--muted);}
    .preview-empty{padding:16px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;}
    .preview-note{text-align:center;color:var(--muted);font-size:13px;margin:26px 0 0;}
    .preview-note a{color:var(--gold);text-decoration:none;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;}

    @media(max-width:640px){
      .boxscore-grid,.preview-grid{grid-template-columns:1fr;}
      .score-hero{grid-template-columns:1fr;gap:18px;}
      .hero-center{order:2;}
      .hero-team:nth-child(1){order:1;}
      .hero-team:nth-child(3){order:3;}
      .score-hero.matchday .hero-team.home,
      .score-hero.matchday .hero-team.away{align-items:center;text-align:center;}
      .hero-team-top.reverse{flex-direction:row;}
      .score-hero.matchday .hero-team.away .hero-score-bar{margin-left:0;}

      /* Apiladas en vertical, usamos el mismo corte diagonal para ambas tarjetas */
      .score-hero.matchday .hero-team{padding:14px 16px 12px;}
      .score-hero.matchday .hero-team::before,
      .score-hero.matchday .hero-team.away::before{
        clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
      }
      .score-hero.matchday .hero-team::after,
      .score-hero.matchday .hero-team.away::after{
        top:0;right:0;left:auto;width:14px;height:14px;
        clip-path:polygon(100% 0, 100% 100%, 0 0);
      }
      .score-hero.matchday .hero-team.away .hero-score-bar{clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);}
    }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">
    <img src="images/logo liga.png" alt="LSC" onerror="this.style.display='none'">
    <span class="nav-logo-text">Liga <span>San Carlos</span></span>
  </a>
  <a href="index.html" class="nav-back">← Sitio</a>
</nav>

<main>
  <div id="root"><div class="loading">Cargando partido...</div></div>
</main>

<script>
const CONFIG = {
  divisions: {
    primera: {
      label:'Primera División', dbTable:'games', playersTable:'players',
      teams: {
        EXMAN:{ abbr:'EX-MAN', name:'EX-Manquehue',          color:'#1E3A8A', logo:'logos/exman.png' },
        ANANA:{ abbr:'ORTHO',  name:'Orthobullets',                  color:'#7A1F3D', logo:'logos/anana.png' },

function fmtClock(totalSeconds){
  const s = Math.max(0, Math.ceil(totalSeconds));

  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function remainingClockSeconds(){
  if (!_liveClock.running || !_liveClock.startedAt) return _liveClock.seconds;

  return Math.max(0, _liveClock.seconds - elapsed);
}

}

function buildTimelineHTML(events, row, teams){
  if (!events.length) return '<div class="timeline-empty">Aún no hay jugadas registradas.</div>';
  // Preferir la foto del marcador guardada junto al evento (home_score/away_score),
  // que ya incluye correcciones (−1, "Corregir resultado final"). Si un evento antiguo
  // no la tiene, seguimos sumando como respaldo para no dejar la línea sin marcador.
  let h = 0, a = 0;
  const rows = events.map(ev => {
    if (ev.event_type === 'points'){
      if (ev.team === row.home) h += (ev.value||0); else a += (ev.value||0);
    }
    const hasSnapshot = ev.home_score != null && ev.away_score != null;
    const scoreLabel = hasSnapshot ? `${ev.home_score}-${ev.away_score}` : `${h}-${a}`;
    const team = teams[ev.team];
    const color = team?.color || '#666';
    let desc;
    if (ev.event_type === 'points'){
      const label = ev.value === 3 ? 'anota un triple' : ev.value === 2 ? 'anota un doble' : `anota +${ev.value}`;
      desc = `<b>${ev.player_name}</b> ${label}`;
    }
    else if (ev.event_type === 'foul') desc = `Falta · <b>${ev.player_name}</b>`;
    else desc = `Sustitución${ev.detail?` · ${ev.detail}`:''} · entra <b>${ev.player_name}</b>`;
    const timeLabel = ev.clock_seconds != null ? fmtClock(ev.clock_seconds) : '';
    return {
      html: `<div class="timeline-item">
        <span class="timeline-q">C${ev.quarter||1}${timeLabel?` · ${timeLabel}`:''}</span>
        <span class="timeline-dot" style="background:${color};"></span>
        <span class="timeline-desc"><span class="team-tag">${team?.abbr||ev.team}</span>${desc}</span>
        <span class="timeline-score">${scoreLabel}</span>
      </div>`,
    };
  });
  return `<div class="timeline-list">${rows.map(r=>r.html).reverse().join('')}</div>`;
}

    return;
  }

  if (row.type === 'upcoming'){
    await renderUpcoming(row);
    return;
  }

  await renderGame(row);

  if (_refreshInterval) clearInterval(_refreshInterval);
  if (_tickInterval) clearInterval(_tickInterval);
  if (row.type === 'live'){
    _tickInterval = setInterval(tickClock, 250);
    _refreshInterval = setInterval(async () => {
      const { data: freshRow } = await _supabase.from(divCfg().dbTable).select('*').eq('id', gameId).single();
      if (!freshRow) return;
      if (freshRow.type !== 'live'){ clearInterval(_refreshInterval); clearInterval(_tickInterval); }
      await renderGame(freshRow);
    }, 6000);
  }
}

// Misma regla que computeStandings() en index.html: 2 pts por victoria, 1 por derrota (0 si es por W.O.);
// desempate por diferencial, duelo directo y puntos anotados.
function computeStandings(finished){
  const rows = {};
  Object.keys(divTeams()).forEach(id => {
    rows[id] = { teamId:id, gp:0, w:0, l:0, diff:0, pointsFor:0, pointsAgainst:0, tablePoints:0 };
  });
  finished.forEach(g => {
    if (!rows[g.home] || !rows[g.away]) return;
    const hs = +g.home_score, as = +g.away_score;
    const h = rows[g.home], a = rows[g.away];
    h.gp++; a.gp++;
    h.pointsFor += hs; a.pointsFor += as;
    h.pointsAgainst += as; a.pointsAgainst += hs;
    h.diff += hs - as; a.diff += as - hs;
    const [win, loss] = hs > as ? [h, a] : [a, h];
    win.w++; win.tablePoints += 2;
    loss.l++; loss.tablePoints += g.walkover ? 0 : 1;
  });
  const headToHead = (idA, idB) => {
    let wA = 0, wB = 0;
    finished.forEach(g => {
      if (g.home === idA && g.away === idB) { if (+g.home_score > +g.away_score) wA++; else wB++; }
      else if (g.home === idB && g.away === idA) { if (+g.home_score > +g.away_score) wB++; else wA++; }
    });
    return wA > wB ? 1 : wB > wA ? -1 : 0;
  };
  return Object.values(rows).sort((a, b) => {
    const ap = a.gp > 0 ? 1 : 0, bp = b.gp > 0 ? 1 : 0;
    if (bp !== ap) return bp - ap;
    if (b.tablePoints !== a.tablePoints) return b.tablePoints - a.tablePoints;
    if (b.diff !== a.diff) return b.diff - a.diff;
    const h2h = headToHead(a.teamId, b.teamId);
    if (h2h !== 0) return -h2h;
    return b.pointsFor - a.pointsFor;
  });
}

// Partidos jugados por un equipo, del más antiguo al más reciente, desde su punto de vista.
function teamResults(finished, teamId){
  return finished
    .filter(g => g.home === teamId || g.away === teamId)
    .map(g => {
      const isHome = g.home === teamId;
      const own = +(isHome ? g.home_score : g.away_score), opp = +(isHome ? g.away_score : g.home_score);
      return { id:g.id, round:g.round, opp:isHome ? g.away : g.home, isHome, own, oppScore:opp, won:own > opp, wo:!!g.walkover };
    });
}

function streakText(results){
  if (!results.length) return '';
  const last = results[results.length - 1].won;
  let n = 0;
  for (let i = results.length - 1; i >= 0 && results[i].won === last; i--) n++;
  if (n < 2) return last ? 'Viene de ganar' : 'Viene de perder';
  return `${n} ${last ? 'victorias' : 'derrotas'} seguidas`;
}

async function buildPreviewHTML(row){
  const teams = divTeams();
  const [gamesRes, playersRes] = await Promise.all([
    _supabase.from(divCfg().dbTable).select('*').eq('type', 'finished')
      .order('round', { ascending: true }).order('id', { ascending: true }),
    _supabase.from(divCfg().playersTable).select('*').in('team', [row.home, row.away]).gt('games', 0),
  ]);
  const finished = gamesRes.data || [];
  const players = playersRes.data || [];

  const standings = computeStandings(finished);
  const pos = id => standings.findIndex(r => r.teamId === id) + 1;
  const st = id => standings.find(r => r.teamId === id);
  const H = st(row.home), A = st(row.away);
  const anyPlayed = H.gp > 0 || A.gp > 0;

  // ── Comparación ──
  const avg = (n, gp) => gp ? n / gp : null;
  const fmt1 = v => v == null ? '—' : v.toFixed(1);
  const signed = v => v > 0 ? `+${v}` : `${v}`;
  // better: 1 = mayor es mejor, -1 = menor es mejor
  const metrics = [
    { label:'Posición',       h:H.gp ? pos(row.home) : null, a:A.gp ? pos(row.away) : null, fmt:v => v == null ? '—' : `${v}°`, better:-1 },
    { label:'Récord (G-P)',   h:H.gp ? H.w : null,  a:A.gp ? A.w : null,  fmt:(v, t) => v == null ? '—' : `${t.w}-${t.l}`, better:1 },
    { label:'Pts. de tabla',  h:H.tablePoints,      a:A.tablePoints,      fmt:v => `${v}`, better:1 },
    { label:'Anota x partido',h:avg(H.pointsFor, H.gp),     a:avg(A.pointsFor, A.gp),     fmt:fmt1, better:1 },
    { label:'Recibe x partido',h:avg(H.pointsAgainst, H.gp),a:avg(A.pointsAgainst, A.gp), fmt:fmt1, better:-1 },
    { label:'Diferencial',    h:H.gp ? H.diff : null, a:A.gp ? A.diff : null, fmt:v => v == null ? '—' : signed(v), better:1 },
  ];
  const cls = (mine, theirs, better) =>
    mine == null || theirs == null || mine === theirs ? '' : ((mine - theirs) * better > 0 ? 'better' : '');
  const compareHTML = `
    <div class="section-title">Cara a cara</div>
    <div class="preview-compare">
      <div class="compare-head"><span>${teams[row.home]?.name || row.home}</span><span></span><span>${teams[row.away]?.name || row.away}</span></div>
      ${metrics.map(m => `<div class="compare-row">
        <span class="cv ${cls(m.h, m.a, m.better)}">${m.fmt(m.h, H)}</span>
        <span class="compare-label">${m.label}</span>
        <span class="cv ${cls(m.a, m.h, m.better)}">${m.fmt(m.a, A)}</span>
      </div>`).join('')}
    </div>`;

  // ── Enfrentamiento previo (en una liga a una vuelta normalmente no hay) ──
  const meetings = finished.filter(g =>
    (g.home === row.home && g.away === row.away) || (g.home === row.away && g.away === row.home));
  const meetingsHTML = meetings.length ? `
    <div class="section-title">Enfrentamientos esta temporada</div>
    <div class="preview-compare">${meetings.map(g => {
      const homeWon = +g.home_score > +g.away_score;
      return `<a class="recent-row" href="partido.html?div=${activeDivision}&id=${g.id}">
        <span class="recent-opp">J${g.round} · <b>${teams[g.home]?.name || g.home}</b> vs <b>${teams[g.away]?.name || g.away}</b></span>
        <span class="recent-res">${g.home_score}–${g.away_score} · gana ${teams[homeWon ? g.home : g.away]?.abbr || ''}</span>
      </a>`;
    }).join('')}</div>` : '';

  // ── Momento de cada equipo ──
  const formBlock = teamId => {
    const t = teams[teamId];
    const res = teamResults(finished, teamId);
    const last5 = res.slice(-5);
    const recent = res.slice(-3).reverse();
    return `<div class="preview-team" style="--tc:${t?.color || '#666'}">
      <div class="preview-team-head"><span>${t?.name || teamId}</span><span class="streak-text">${streakText(res)}</span></div>
      ${res.length ? `
        <div class="form-chips">${last5.map(r => `<span class="form-chip ${r.won ? 'w' : 'l'}" title="J${r.round} vs ${teams[r.opp]?.name || r.opp}: ${r.own}–${r.oppScore}">${r.won ? 'G' : 'P'}</span>`).join('')}</div>
        ${recent.map(r => `<a class="recent-row" href="partido.html?div=${activeDivision}&id=${r.id}">
          <span class="recent-opp">J${r.round} · ${r.isHome ? 'vs' : '@'} <b>${teams[r.opp]?.name || r.opp}</b></span>
          <span class="recent-res ${r.won ? 'w' : 'l'}">${r.won ? 'G' : 'P'} ${r.wo ? 'W.O.' : `${r.own}–${r.oppScore}`}</span>
        </a>`).join('')}`
      : '<div class="preview-empty">Aún no juega esta temporada.</div>'}
    </div>`;
  };

  // ── Jugadores a seguir: top 3 por promedio de puntos ──
  const keyBlock = teamId => {
    const t = teams[teamId];
    const top = players.filter(p => p.team === teamId)
      .map(p => ({ ...p, ppg: p.points / p.games }))
      .sort((a, b) => b.ppg - a.ppg || b.points - a.points)
      .slice(0, 3);
    return `<div class="preview-team" style="--tc:${t?.color || '#666'}">
      <div class="preview-team-head"><span>${t?.name || teamId}</span></div>
      ${top.length ? top.map(p => `<a class="key-player" href="player.html?id=${p.id}&div=${activeDivision}">
          <span class="key-num">${p.number != null ? '#' + p.number : ''}</span>
          <span class="key-name">${p.name}<span class="key-sub">${p.points} pts en ${p.games} PJ</span></span>
          <span class="key-ppg">${p.ppg.toFixed(1)}<small>PPG</small></span>
        </a>`).join('')
      : '<div class="preview-empty">Sin puntos registrados todavía.</div>'}
    </div>`;
  };

  return `
    ${anyPlayed ? compareHTML : ''}
    ${meetingsHTML}
    <div class="section-title">Cómo llegan</div>
    <div class="preview-grid">${formBlock(row.home)}${formBlock(row.away)}</div>
    <div class="section-title">Jugadores a seguir</div>
    <div class="preview-grid">${keyBlock(row.home)}${keyBlock(row.away)}</div>
    <p class="preview-note">El marcador en vivo aparece aquí cuando arranque el partido · <a href="index.html#games-root">Ver todos los partidos →</a></p>`;
}

            <div class="hero-clock" id="hero-clock-display">${fmtClock(remainingClockSeconds())}</div>
          ` : `
            <div class="hero-vs">VS</div>
            <div class="hero-meta">📅 ${row.date || ''}</div>
          `}
        </div>

        <div class="hero-team away" style="--tc:${away?.color||'#666'}">
          <div class="hero-team-top reverse">
            <div class="hero-team-logo">${teamLogoHTML(row.away)}</div>
            <div class="hero-team-id">
              <div class="hero-team-name">${(away?.name || row.away).toUpperCase()}</div>
              <div class="hero-team-tag">Visita</div>
            </div>
          </div>
          <div class="hero-score ${!isLive ? (homeWon?'loser':'winner') : ''}">${awayScore}</div>
          <div class="hero-score-bar"></div>
        </div>
      </div>

      ${isLive ? `<div class="hero-fouls-line">Faltas de equipo: ${row.home_fouls||0} – ${row.away_fouls||0}</div>` : ''}
      ${(!isLive && row.mvp) ? `<div class="hero-mvp"><span style="font-size:18px;">⭐</span><div><div class="hero-mvp-label">MVP del partido</div><div class="hero-mvp-name">${row.mvp}</div></div></div>` : ''}
    </div>

    ${topPerformers.length ? `
    <div class="section-title">⭐ Destacados del partido</div>
    <div class="performers-row">
      ${topPerformers.map((s,i) => `<div class="performer-card" style="--pc:${teams[s.team]?.color || '#666'}">
        <div class="performer-num">${i+1}</div>
        <div class="performer-info">
          <div class="performer-rank">${teams[s.team]?.abbr || s.team}</div>
          <div class="performer-name">${s.player_name}</div>
          <div class="performer-pts">${s.points} PTS</div>
        </div>
      </div>`).join('')}
    </div>` : ''}

    <div class="stats-toggle">
      <button class="stats-tab ${_statsView==='stats'?'active':''}" id="tab-stats-btn" onclick="setStatsView('stats')">📊 Estadísticas</button>
      <button class="stats-tab ${_statsView==='plays'?'active':''}" id="tab-plays-btn" onclick="setStatsView('plays')">🎯 Jugada a jugada</button>
    </div>

    <div id="stats-panel" ${_statsView!=='stats'?'hidden':''}>
      <div class="boxscore-grid">
        ${boxTeam(row.home, home, homeStats, homeLeader)}
        ${boxTeam(row.away, away, awayStats, awayLeader)}
      </div>
      ${isLive ? `<div class="boxscore-legend">
        <span><span class="court-dot on"></span>En cancha</span>
        <span><span class="court-dot off"></span>Fuera de cancha</span>
        <span>⭐ Líder anotador</span>
      </div>` : ''}
    </div>

    <div id="plays-panel" ${_statsView!=='plays'?'hidden':''}>
      ${timelineHTML}
    </div>`;
}

load();
</script>
</body>
</html>
