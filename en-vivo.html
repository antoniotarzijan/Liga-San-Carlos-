<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>En Vivo · Liga San Carlos</title>
  <link rel="icon" type="image/png" href="images/logo liga.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root{
      --red:#f80808; --blue:#3009dc; --gold:#f2b34e;
      --dark:#08090C; --dark2:#111318; --card:#161920;
      --text:#E8EAF0; --muted:#6B7280; --border:rgba(255,255,255,0.07);
      --green:#4ADE80;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");background-size:180px;pointer-events:none;opacity:0.6;}
    main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 60px;}

    nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 clamp(16px,4vw,32px);background:rgba(8,9,12,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .nav-logo img{height:30px;}
    .nav-logo-text{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:1px;color:var(--text);}
    .nav-logo-text span{color:var(--red);}
    .nav-back{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 14px;border:1px solid var(--border);border-radius:4px;}
    .nav-back:hover{color:var(--text);border-color:rgba(255,255,255,.2);}

    .hero-bar{padding:36px 0 22px;text-align:center;}
    .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
    .live-dot-big{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .hero-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(38px,8vw,60px);letter-spacing:1px;line-height:1;}
    .hero-title span{color:var(--red);}

    .div-tabs{display:flex;justify-content:center;gap:10px;margin:20px 0 30px;}
    .div-tab{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:9px 18px;border-radius:3px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;}
    .div-tab.active.primera{background:var(--red);color:#fff;border-color:var(--red);}
    .div-tab.active.segunda{background:var(--blue);color:#fff;border-color:var(--blue);}

    .live-grid{display:flex;flex-direction:column;gap:22px;}
    .lg-card{background:var(--card);border:1px solid rgba(248,8,8,.3);border-radius:12px;overflow:hidden;}
    .lg-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(248,8,8,.08);border-bottom:1px solid var(--border);}
    .lg-head-left{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--red);}
    .lg-round{font-size:12px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;}
    .lg-body{padding:26px 20px;}
    .lg-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;}
    .lg-team{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
    .lg-team-logo{width:56px;height:56px;display:flex;align-items:center;justify-content:center;}
    .lg-team-logo img{width:100%;height:100%;object-fit:contain;}
    .lg-team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;min-height:34px;display:flex;align-items:center;}
    .lg-team-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,9vw,64px);line-height:1;}
    .lg-center{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .lg-quarter{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
    .lg-clock{font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,5vw,34px);letter-spacing:1px;color:var(--green);}
    .lg-clock.paused{color:var(--muted);}
    .lg-vs{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--muted);}

    .lg-fouls{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);background:rgba(255,255,255,.02);}
    .lg-fouls-item{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;}
    .lg-fouls-item b{color:var(--text);font-size:13px;}
    .lg-fouls-item.bonus b{color:var(--red);}

    .lg-players{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border);}
    .lg-players-col{padding:14px 18px;}
    .lg-players-col:first-child{border-right:1px solid var(--border);}
    .lg-players-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
    .lg-player-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;}
    .lg-player-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--text);}
    .lg-player-stats{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);white-space:nowrap;margin-left:8px;}
    .lg-player-stats b{color:var(--gold);}
    .lg-player-stats .fo{color:#F87171;}
    .lg-players-empty{font-size:11px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;}
    @media(max-width:520px){
      .lg-players{grid-template-columns:1fr;}
      .lg-players-col:first-child{border-right:none;border-bottom:1px solid var(--border);}
    }

    .empty-state{text-align:center;padding:80px 20px;color:var(--muted);}
    .empty-icon{font-size:44px;margin-bottom:16px;}
    .empty-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--text);margin-bottom:8px;}
    .empty-sub{font-size:14px;margin-bottom:24px;}
    .empty-cta{display:inline-block;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;background:var(--red);color:#fff;padding:12px 24px;border-radius:4px;text-decoration:none;}

    @media(max-width:520px){
      .lg-teams{grid-template-columns:1fr;gap:10px;}
      .lg-vs{display:none;}
      .lg-center{order:2;padding:8px 0;}
      .lg-team:nth-child(1){order:1;}
      .lg-team:nth-child(3){order:3;}
    }
  </style>
</head>
<body>
<main>
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="images/logo liga.png" alt="LSC" onerror="this.style.display='none'">
      <span class="nav-logo-text">Liga <span>San Carlos</span></span>
    </a>
    <a href="index.html" class="nav-back">← Sitio</a>
  </nav>

  <div class="hero-bar">
    <div class="hero-eyebrow"><span class="live-dot-big"></span>Marcador en vivo</div>
    <div class="hero-title">EN <span>VIVO</span></div>
  </div>

  <div class="div-tabs">
    <button class="div-tab primera" id="tab-primera" onclick="setDivision('primera')">1° División</button>
    <button class="div-tab segunda" id="tab-segunda" onclick="setDivision('segunda')">2° División</button>
  </div>

  <div id="live-root" class="live-grid"></div>
</main>

<script>
const CONFIG = {
  divisions: {
    primera: {
      label:'Primera División', dbTable:'games', playersTable:'players',
      teams: {
        EXMAN:{ abbr:'EX-MAN', name:'EX-Manquehue',          color:'#1E3A8A', logo:'logos/exman.png' },
        ANANA:{ abbr:'ORTHO',  name:'Orthobullets',                  color:'#7C3AED', logo:'logos/anana.png' },
        OLDDS:{ abbr:'OLD-DS', name:'Old-DS',                 color:'#065F46', logo:'logos/ols ds.png' },
        INGUC:{ abbr:'INGUC',  name:'Ingeniería UC',          color:'#92400E', logo:'logos/ing.png' },
        TRO:  { abbr:'TRO',    name:'Tropics',                color:'#BE185D', logo:'logos/trop.png' },
        SWD:  { abbr:'AM',    name:'Atlético Metropolitano', color:'#0E7490', logo:'logos/swd.png' },
        SAL:  { abbr:'SAL',    name:'Salitre',                color:'#1F2937', logo:'logos/salitre.png' },
        BAR:  { abbr:'BAR',    name:'Ex-ABC',     color:'#D4A800', logo:'logos/barne.png' },
        T2A:  { abbr:'BRE',    name:'Brillante Resplandor',   color:'#B91C1C', logo:'logos/brillante.png' },
      },
    },
    segunda: {
      label:'Segunda División', dbTable:'games_segunda', playersTable:'players_segunda',
      teams: {
        T2B:{ abbr:'DYN', name:'Dynamos',              color:'#1D4ED8', logo:'logos/dynamos.png' },
        T2C:{ abbr:'DER', name:'Derazzo',              color:'#047857', logo:'logos/derazzo.png' },
        T2D:{ abbr:'TAB', name:'Tabancura',            color:'#B45309', logo:'logos/tabancura .png' },
        T2E:{ abbr:'MMO', name:'Nanami',         color:'#6D28D9', logo:'logos/nanami.png' },
        T2F:{ abbr:'CSQ', name:'Cusqueños',            color:'#0F766E', logo:'logos/cusquenos.png' },
        T2G:{ abbr:'PIS', name:'Piscoliers',           color:'#BE185D', logo:'logos/piscoliers.png' },
        T2H:{ abbr:'CHC', name:'Chat HC',              color:'#78350F', logo:'logos/chat.png' },
        T2I:{ abbr:'BULL',name:'Provilocura',              color:'#1E1B4B', logo:'logos/bullets.png' },
        T2J:{ abbr:'RIM', name:'Rimbreakers',              color:'#0891B2', logo:'logos/rimbreakers.png' },
      },
    },
  },
};

const SUPABASE_URL = 'https://shresvpjavpxdosdtjfh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNocmVzdnBqYXZweGRvc2R0amZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwOTQ3ODMsImV4cCI6MjA5MDY3MDc4M30.eBZNEhkNZFltKepiGttzyr-GVkG1mGT9rn6GEyNecdA';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let activeDivision = 'primera';
let liveGames = [];
let tickHandle = null;

function divCfg(){ return CONFIG.divisions[activeDivision]; }
function divTeams(){ return divCfg().teams; }

function setDivision(div){
  activeDivision = div;
  document.getElementById('tab-primera').classList.toggle('active', div==='primera');
  document.getElementById('tab-primera').classList.toggle('primera', true);
  document.getElementById('tab-segunda').classList.toggle('active', div==='segunda');
  document.getElementById('tab-segunda').classList.toggle('segunda', true);
  fetchLive();
}

function rowToLive(row){
  return {
    id: row.id, round: row.round, venue: row.venue, home: row.home, away: row.away,
    homeScore: row.home_score || 0, awayScore: row.away_score || 0,
    quarter: row.quarter || 1,
    clockSeconds: row.clock_seconds ?? (row.period_length_seconds || 600),
    clockRunning: !!row.clock_running,
    clockStartedAt: row.clock_started_at,
    homeFouls: row.home_fouls || 0, awayFouls: row.away_fouls || 0,
  };
}

async function fetchLive(){
  const { data, error } = await _supabase.from(divCfg().dbTable).select('*').eq('type','live').order('round',{ascending:true});
  if (error){ console.error(error.message); return; }
  liveGames = (data || []).map(rowToLive);

  if (liveGames.length){
    const statsResults = await Promise.all(liveGames.map(g =>
      _supabase.from('game_stats').select('*').eq('game_id', g.id).eq('division', activeDivision)
    ));
    liveGames.forEach((g, i) => { g.stats = statsResults[i].data || []; });
  }

  renderLive();
}

function teamLogoHTML(id){
  const t = divTeams()[id];
  if (!t) return '';
  return t.logo
    ? `<img src="${t.logo}" alt="${t.name}" onerror="this.parentElement.textContent='${t.abbr}'">`
    : t.abbr;
}

function fmtClock(totalSeconds){
  const s = Math.max(0, Math.ceil(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}
function remainingSeconds(g){
  if (!g.clockRunning || !g.clockStartedAt) return g.clockSeconds;
  const elapsed = (Date.now() - new Date(g.clockStartedAt).getTime()) / 1000;
  return Math.max(0, g.clockSeconds - elapsed);
}
function quarterLabel(q){
  return q <= 4 ? `CUARTO ${q}` : (q === 5 ? 'TIEMPO EXTRA' : `TIEMPO EXTRA ${q-4}`);
}

function playerStatsHTML(stats, teamId){
  const rows = (stats || []).filter(s => s.team === teamId && (s.points > 0 || s.fouls > 0))
    .sort((a,b) => b.points - a.points);
  if (!rows.length) return `<div class="lg-players-empty">Sin puntos aún</div>`;
  return rows.map(s => `
    <div class="lg-player-row">
      <span class="lg-player-name">${s.player_name}${s.player_number != null ? ' #' + s.player_number : ''}</span>
      <span class="lg-player-stats"><b>${s.points}</b> pts · <span class="fo">${s.fouls || 0}</span> f</span>
    </div>`).join('');
}

function renderLive(){
  const root = document.getElementById('live-root');
  if (!liveGames.length){
    root.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🏀</div>
        <div class="empty-title">No hay partidos en vivo</div>
        <div class="empty-sub">Vuelve a revisar cuando comience un partido, o mira los próximos.</div>
        <a href="index.html#games-root" class="empty-cta">Ver próximos partidos →</a>
      </div>`;
    return;
  }
  const teams = divTeams();
  root.innerHTML = liveGames.map(g => {
    const home = teams[g.home], away = teams[g.away];
    const remaining = remainingSeconds(g);
    return `
    <div class="lg-card" data-game-id="${g.id}">
      <div class="lg-head">
        <div class="lg-head-left"><span class="live-dot-big"></span>EN VIVO</div>
        <div class="lg-round">Jornada ${g.round} · 🏟️ ${g.venue || ''}</div>
      </div>
      <div class="lg-body">
        <div class="lg-teams">
          <div class="lg-team">
            <div class="lg-team-logo">${teamLogoHTML(g.home)}</div>
            <div class="lg-team-name">${home?.name || g.home}</div>
            <div class="lg-team-score">${g.homeScore}</div>
          </div>
          <div class="lg-center">
            <div class="lg-quarter">${quarterLabel(g.quarter)}</div>
            <div class="lg-clock ${g.clockRunning?'':'paused'}" data-clock-seconds="${g.clockSeconds}" data-clock-running="${g.clockRunning}" data-clock-started="${g.clockStartedAt||''}">${fmtClock(remaining)}</div>
            <div class="lg-vs">VS</div>
          </div>
          <div class="lg-team">
            <div class="lg-team-logo">${teamLogoHTML(g.away)}</div>
            <div class="lg-team-name">${away?.name || g.away}</div>
            <div class="lg-team-score">${g.awayScore}</div>
          </div>
        </div>
      </div>
      <div class="lg-fouls">
        <div class="lg-fouls-item ${g.homeFouls>=5?'bonus':''}">Faltas ${home?.name||g.home}: <b>${g.homeFouls}</b></div>
        <div class="lg-fouls-item ${g.awayFouls>=5?'bonus':''}">Faltas ${away?.name||g.away}: <b>${g.awayFouls}</b></div>
      </div>
      <div class="lg-players">
        <div class="lg-players-col">
          <div class="lg-players-title">${home?.name || g.home}</div>
          ${playerStatsHTML(g.stats, g.home)}
        </div>
        <div class="lg-players-col">
          <div class="lg-players-title">${away?.name || g.away}</div>
          ${playerStatsHTML(g.stats, g.away)}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* Tick del cronómetro en pantalla, entre cada refresco de datos */
function tickClocks(){
  document.querySelectorAll('.lg-clock').forEach(el => {
    const running = el.dataset.clockRunning === 'true';
    const seconds = parseFloat(el.dataset.clockSeconds);
    const started = el.dataset.clockStarted;
    if (!running || !started) return;
    const elapsed = (Date.now() - new Date(started).getTime()) / 1000;
    el.textContent = fmtClock(Math.max(0, seconds - elapsed));
  });
}

fetchLive();
setInterval(fetchLive, 5000);   // refresco de datos cada 5s
setInterval(tickClocks, 250);   // cronómetro visual fluido entre refrescos
</script>
</body>
</html>
