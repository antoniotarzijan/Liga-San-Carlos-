<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playoffs · Liga San Carlos 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="playoffs.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary:   #f80808;
      --color-secondary: #3009dc;
      --color-accent:    #f2b34e;
      --color-bg:        #08090C;
      --color-bg2:       #111318;
      --color-card:      #161920;
      --color-text:      #E8EAF0;
      --color-muted:     #6B7280;
      --color-border:    rgba(255,255,255,0.07);
      --red:    #f80808;
      --blue:   #3009dc;
      --gold:   #f2b34e;
      --dark:   #08090C;
      --dark2:  #111318;
      --card:   #161920;
      --text:   #E8EAF0;
      --muted:  #6B7280;
      --border: rgba(255,255,255,0.07);
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      background-size: 180px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 clamp(16px,5vw,80px);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8,9,12,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .nav-logo { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; }
    .nav-logo span { color: var(--red); }
    .nav-back {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      transition: all .15s;
    }
    .nav-back:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
    .nav-div-tabs { display: flex; gap: 6px; }
    .div-tab {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 2px;
      cursor: pointer;
      border: none;
      transition: all .2s;
    }
    .div-tab.primera { background: rgba(248,8,8,.12); color: var(--red); border: 1px solid rgba(248,8,8,.25); }
    .div-tab.segunda { background: rgba(48,9,220,.12); color: #4e7fff; border: 1px solid rgba(48,9,220,.25); }
    .div-tab.active.primera { background: var(--red); color: #fff; }
    .div-tab.active.segunda { background: var(--blue); color: #fff; }

    /* ── HERO STRIP ── */
    .playoff-hero {
      position: relative;
      z-index: 1;
      padding: 100px clamp(16px,5vw,80px) 40px;
      text-align: center;
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(248,8,8,.15), transparent 65%);
      border-bottom: 1px solid var(--border);
    }
    .playoff-hero.segunda-active {
      background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(48,9,220,.15), transparent 65%);
    }
    .playoff-eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .playoff-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 7vw, 88px);
      letter-spacing: 2px;
      line-height: .95;
    }
    .playoff-title .accent-red  { color: var(--red); }
    .playoff-title .accent-blue { color: #4e7fff; }
    .playoff-div-sub {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(16px, 2.5vw, 24px);
      letter-spacing: 4px;
      color: var(--muted);
      margin-top: 6px;
    }
    .playoff-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      padding: 8px 18px;
      border-radius: 99px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-pending { background: rgba(107,114,128,.12); border: 1px solid rgba(107,114,128,.25); color: var(--muted); }
    .pill-active  { background: rgba(248,8,8,.12);     border: 1px solid rgba(248,8,8,.3);     color: var(--red); }
    .pill-dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
    .pill-active .pill-dot { animation: pulse 1.2s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── MAIN ── */
    main { position: relative; z-index: 1; }

    .bracket-page { padding: 40px clamp(12px,3vw,60px) 60px; }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px,5vw,50px);
      letter-spacing: 1px;
    }
    .section-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      padding: 4px 10px;
      border: 1px solid var(--red);
      border-radius: 2px;
    }
    .section-line { flex:1; height:1px; background:var(--border); }

    /* ── ROUND LABELS ── */
    .bracket-rounds-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 4px;
    }
    .round-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      flex: 1;
    }
    .round-label.champion { color: var(--gold); }

    /* ── BRACKET LAYOUT ── */
    .bracket-wrap {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .bracket-col {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 160px;
      position: relative;
    }
    .connector-col {
      width: 28px;
      flex-shrink: 0;
      position: relative;
      align-self: stretch;
    }
    .bracket-spacer { flex: 1; }

    /* ── PROYECCIÓN ── */
    .projection-banner { max-width: 1200px; margin: 0 auto 18px; padding: 12px 16px; border: 1px dashed rgba(242,179,78,.4); border-radius: 6px; background: rgba(242,179,78,.05); font-size: 13px; line-height: 1.5; color: #C9CDD6; text-align: center; }
    .projection-banner strong { color: var(--gold); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase; }
    .bracket-page.projected .matchup { border-style: dashed; }
    a.matchup { display: block; color: inherit; text-decoration: none; }
    .matchup-live { color: var(--red); margin-left: 6px; }

    /* ── ANOTADORES PLAYOFFS ── */
    .po-scorers { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .po-scorer { display: grid; grid-template-columns: 34px 1fr 54px 54px 60px; align-items: center; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--border); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; }
    .po-scorer:last-child { border-bottom: none; }
    .po-scorer.head { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); background: rgba(255,255,255,.03); }
    .po-scorer .num { text-align: center; }
    .po-scorer .rank { color: var(--muted); text-align: center; }
    .po-scorer .pts { color: var(--gold); text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 400; }
    .po-scorer .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .po-scorer .who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .po-scorer .who small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .5px; }

    /* ── MATCHUP CARD ── */
    .matchup {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden;
      margin: 0 4px;
      transition: border-color .2s;
      position: relative;
    }
    .matchup:hover { border-color: rgba(255,255,255,.18); }
    .matchup.semifinal  { border-color: rgba(248,8,8,.2); }
    .matchup.final      { border-color: rgba(242,179,78,.3); }
    .matchup.champion-match { border-color: rgba(242,179,78,.5); }

    .matchup-round-tag {
      padding: 5px 10px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid var(--border);
    }
    .matchup.semifinal .matchup-round-tag { color: rgba(248,8,8,.7); }
    .matchup.final     .matchup-round-tag { color: var(--gold); }

    .team-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      border-bottom: 1px solid var(--border);
      min-height: 44px;
      position: relative;
    }
    .team-row:last-child  { border-bottom: none; }
    .team-row.winner { background: rgba(74,222,128,.04); }
    .team-row.loser  { background: transparent; }

    .team-seed {
      width: 24px;
      height: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 11px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .team-row.winner .team-seed { color: var(--gold); background: rgba(242,179,78,.07); border-right-color: rgba(242,179,78,.15); }

    .team-logo-sm {
      width: 28px; height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 6px;
    }
    .team-logo-sm img { width:100%; height:100%; object-fit:contain; }
    .team-logo-placeholder {
      width: 22px; height: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 8px; color: #fff; flex-shrink: 0;
    }
    .team-name-bracket {
      flex: 1;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .3px;
      padding: 0 8px 0 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .team-row.winner .team-name-bracket { color: var(--text); }
    .team-row.loser  .team-name-bracket { color: var(--muted); }
    .team-row.tbd    .team-name-bracket { color: rgba(107,114,128,.4); font-style: italic; }
    .team-score-bracket {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; line-height:1;
      width: 36px; text-align: center;
      flex-shrink: 0; padding: 0 4px;
    }
    .team-row.winner .team-score-bracket { color: var(--text); }
    .team-row.loser  .team-score-bracket { color: var(--muted); }
    .team-row.tbd    .team-score-bracket { color: rgba(107,114,128,.2); font-size: 14px; }
    .winner-check {
      width:16px; height:16px;
      border-radius:50%;
      background:rgba(74,222,128,.2);
      border:1px solid rgba(74,222,128,.4);
      display:flex; align-items:center; justify-content:center;
      font-size:8px; margin-right:6px; flex-shrink:0; color:#4ADE80;
    }

    /* ── CHAMPION CARD ── */
    .champion-wrap { display:flex; align-items:center; justify-content:center; flex:1; }
    .champion-card {
      background: linear-gradient(135deg,rgba(242,179,78,.1),rgba(242,179,78,.04));
      border: 1px solid rgba(242,179,78,.35);
      border-radius: 8px;
      padding: 24px 20px;
      text-align: center;
      margin: 4px;
      position: relative;
      overflow: hidden;
      min-width: 140px;
    }
    .champion-card::before {
      content:'';
      position:absolute; inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(242,179,78,.15),transparent 65%);
    }
    .champion-trophy  { font-size:32px; margin-bottom:10px; position:relative; z-index:1; }
    .champion-label   { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin-bottom:10px; position:relative; z-index:1; }
    .champion-logo    { width:56px; height:56px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; position:relative; z-index:1; }
    .champion-logo img { width:100%; height:100%; object-fit:contain; }
    .champion-logo-placeholder { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:16px; color:#fff; opacity:.6; }
    .champion-name { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; color:var(--gold); position:relative; z-index:1; }
    .champion-tbd  { font-family:'Barlow Condensed',sans-serif; font-size:14px; color:rgba(242,179,78,.3); letter-spacing:2px; text-transform:uppercase; position:relative; z-index:1; }

    /* ── CONNECTOR SVG ── */
    .bracket-svg-lines { position:absolute; inset:0; pointer-events:none; overflow:visible; }
    .connector-line    { fill:none; stroke:rgba(255,255,255,.08); stroke-width:1.5; }

    /* ── LEGEND ── */
    .bracket-legend {
      display:flex; gap:20px; flex-wrap:wrap;
      margin-top:28px; padding:16px 20px;
      background:var(--card); border:1px solid var(--border); border-radius:5px;
    }
    .legend-item {
      display:flex; align-items:center; gap:7px;
      font-family:'Barlow Condensed',sans-serif;
      font-size:12px; letter-spacing:1px; color:var(--muted);
    }
    .legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

    /* ════════════════════════════════
       PLAYOFF GAMES SECTION
    ════════════════════════════════ */
    .playoff-games-section {
      padding: 0 clamp(12px,3vw,60px) 70px;
    }

    /* Filter tabs */
    .games-filter {
      display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 12px;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 8px 18px; border-radius: 2px;
      border: 1px solid var(--border);
      background: transparent; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .filter-btn.active { background: var(--red); color:#fff; border-color:var(--red); }
    .filter-btn:hover:not(.active) { border-color: rgba(255,255,255,.2); color: var(--text); }

    /* Games grid */
    .games-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }

    /* Game card */
    .game-card {
      background: var(--card); border:1px solid var(--border);
      border-radius: 5px; overflow:hidden;
      transition: transform .2s, border-color .2s;
    }
    .game-card:hover { transform:translateY(-3px); border-color:rgba(255,255,255,.15); }
    .game-card.upcoming { border-color:rgba(242,179,78,.25); background:rgba(242,179,78,.02); }
    .game-card.finished { border-color:rgba(74,222,128,.15); }

    .game-card-header {
      padding: 9px 14px;
      background: rgba(255,255,255,.04);
      border-bottom: 1px solid var(--border);
      display: flex; justify-content:space-between; align-items:center;
    }
    .game-card.upcoming .game-card-header { background:rgba(242,179,78,.06); }
    .game-card.finished .game-card-header { background:rgba(74,222,128,.04); }

    .game-round-tag {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
    }
    .game-card.upcoming .game-round-tag { color:var(--gold); }
    .game-card.finished .game-round-tag { color:#4ADE80; }

    .game-date-tag { font-size:11px; color:var(--muted); }
    .game-card.upcoming .game-date-tag { color:var(--gold); }
    .game-card.finished .game-date-tag { color:#4ADE80; }

    .game-body { padding:16px 14px; }
    .team-score-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:7px 0; border-bottom:1px solid var(--border);
    }
    .team-score-row:last-child { border-bottom:none; }
    .ts-info { display:flex; align-items:center; gap:9px; min-width:0; flex:1; }
    .ts-logo-sm {
      width:34px; height:34px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    .ts-logo-sm img { width:100%; height:100%; object-fit:contain; }
    .ts-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:14px; letter-spacing:.3px;
      min-width:0;
      white-space:normal;
      overflow-wrap:break-word;
    }
    .ts-score-pl {
      font-family:'Bebas Neue',sans-serif; font-size:34px; line-height:1;
    }
    .ts-score-pl.winner { color:var(--text); }
    .ts-score-pl.loser  { color:var(--muted); }
    .vs-label { font-family:'Bebas Neue',sans-serif; font-size:20px; color:var(--muted); }

    .game-footer {
      padding:9px 14px; border-top:1px solid var(--border);
      font-size:11px; color:var(--muted);
      display:flex; justify-content:space-between; align-items:center;
      flex-wrap:wrap; gap:6px;
    }
    .mvp-tag { color:var(--gold); }

    /* Empty state */
    .games-empty {
      padding:52px; text-align:center; color:var(--muted);
      font-family:'Barlow Condensed',sans-serif; font-size:14px;
      letter-spacing:2px; text-transform:uppercase;
    }

    /* ── ADMIN SECTION ── */
    #playoff-admin { display:none; background:var(--dark2); border-top:1px solid var(--border); }
    #playoff-admin.open { display:block; }
    .padmin-wrap { max-width:820px; margin:0 auto; padding:36px clamp(16px,4vw,48px); }
    .padmin-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:1px; margin-bottom:6px; }
    .padmin-title span { color:var(--red); }
    .padmin-subtitle { font-size:13px; color:var(--muted); margin-bottom:28px; }

    /* Admin tabs */
    .padmin-tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:24px; overflow-x:auto; }
    .padmin-tab {
      flex:1; min-width:fit-content; padding:12px 10px;
      font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px;
      letter-spacing:2px; text-transform:uppercase; color:var(--muted);
      background:none; border:none; cursor:pointer;
      border-bottom:2px solid transparent; transition:all .15s; white-space:nowrap;
    }
    .padmin-tab.active { color:var(--text); border-bottom-color:var(--red); }

    .padmin-pane { display:none; }
    .padmin-pane.active { display:block; }

    .padmin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
    .padmin-matchup-card { background:var(--card); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .padmin-matchup-header {
      padding:10px 14px; background:rgba(255,255,255,.04);
      border-bottom:1px solid var(--border);
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted);
      display:flex; justify-content:space-between; align-items:center;
    }
    .padmin-matchup-body { padding:14px; }
    .padmin-row {
      display:grid; grid-template-columns:1fr 60px; gap:10px;
      align-items:center; padding:6px 0; border-bottom:1px solid var(--border);
    }
    .padmin-row:last-child { border-bottom:none; }
    .padmin-team-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; }
    .padmin-select, .padmin-input {
      width:100%; background:rgba(255,255,255,.05);
      border:1px solid var(--border); border-radius:4px;
      padding:8px 10px; color:var(--text);
      font-family:'Barlow',sans-serif; font-size:13px; outline:none;
    }
    .padmin-select:focus, .padmin-input:focus { border-color:rgba(255,255,255,.2); }
    .padmin-select option { background:var(--dark2); }
    .padmin-score-input {
      width:100%; background:rgba(255,255,255,.05);
      border:1px solid var(--border); border-radius:4px;
      padding:8px; color:var(--text);

      text-align:center; outline:none; -moz-appearance:textfield;

    .padmin-score-input::-webkit-inner-spin-button { -webkit-appearance:none; }
    .padmin-score-input:focus { border-color:rgba(255,255,255,.2); }
    .padmin-actions { display:flex; gap:10px; justify-content:flex-end; padding:14px; border-top:1px solid var(--border); }

    /* Section subtitle */
    .section-subtitle {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:12px; letter-spacing:2px; text-transform:uppercase;
      color:var(--muted); margin-bottom:14px; padding-bottom:8px;
      border-bottom:1px solid var(--border);
    }

    /* form elements */
    label { display:block; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    input, select, textarea { width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:4px; padding:10px 12px; color:var(--text); font-family:'Barlow',sans-serif; font-size:14px; outline:none; transition:border-color .15s; }
    input:focus, select:focus, textarea:focus { border-color:rgba(255,255,255,.25); }
    select option { background:var(--dark2); }
    input[type=number] { -moz-appearance:textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
    .form-group { margin-bottom:16px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

    /* Game admin list */
    .game-admin-list { display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto; }
    .game-admin-item {
      background:rgba(255,255,255,.03); border:1px solid var(--border);
      border-radius:4px; padding:12px 14px;

    .game-admin-item-info { flex:1; }
    .game-admin-item-teams { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; }
    .game-admin-item-meta { font-size:12px; color:var(--muted); margin-top:2px; }
    .game-admin-actions { display:flex; gap:8px; flex-shrink:0; }
    .tag-upcoming { color:var(--gold); font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10px; letter-spacing:2px; }
    .tag-finished { color:#4ADE80;   font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10px; letter-spacing:2px; }

    /* Buttons */
    .btn { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; text-transform:uppercase; padding:10px 20px; border-radius:4px; border:none; cursor:pointer; transition:all .2s; }
    .btn-red    { background:var(--red);  color:#fff; }
    .btn-red:hover    { background:#c8001a; }
    .btn-gold   { background:var(--gold); color:#000; }
    .btn-gold:hover   { background:#e0951f; }
    .btn-blue   { background:var(--blue); color:#fff; }
    .btn-blue:hover   { background:#2206a0; }
    .btn-outline { background:none; border:1px solid var(--border); color:var(--muted); }
    .btn-outline:hover { border-color:rgba(255,255,255,.2); color:var(--text); }
    .btn-danger { background:rgba(248,113,113,.15); border:1px solid rgba(248,113,113,.3); color:#F87171; }
    .btn-danger:hover { background:rgba(248,113,113,.25); }

    /* Score row in result form */
    .score-row { display:grid; grid-template-columns:1fr 80px; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .score-row:last-child { border-bottom:none; }
    .score-team-name { font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:15px; }

    /* Admin toggle btn */
    .admin-toggle-btn {
      font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px;
      letter-spacing:2px; text-transform:uppercase;
      background:none; border:1px solid var(--border); color:var(--muted);
      padding:6px 14px; border-radius:3px; cursor:pointer; transition:all .15s;
    }
    .admin-toggle-btn:hover { border-color:rgba(255,255,255,.2); color:var(--text); }

    /* Logout btn */
    .admin-logout-btn {
      font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:10px;
      letter-spacing:2px; text-transform:uppercase; padding:6px 12px; border-radius:3px;
      border:1px solid rgba(248,113,113,.3); background:rgba(248,113,113,.08); color:#F87171;
      cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:6px;
    }
    .admin-logout-btn:hover { background:rgba(248,113,113,.18); border-color:rgba(248,113,113,.5); }

    /* Modal contraseña / login */
    #ppwd-modal, #login-modal {
      display:none; position:fixed; inset:0; z-index:500;
      background:rgba(0,0,0,.9); backdrop-filter:blur(12px);
      align-items:center; justify-content:center;
    }
    #ppwd-modal.open, #login-modal.open { display:flex; }
    .ppwd-box, .login-box {
      background:var(--card); border:1px solid rgba(255,255,255,.14);
      border-radius:8px; padding:32px 28px; width:100%; max-width:340px; text-align:center;
    }
    .ppwd-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; margin-bottom:4px; }
    .ppwd-sub   { font-size:13px; color:var(--muted); margin-bottom:20px; }
    .ppwd-input, .login-input {
      width:100%; background:rgba(255,255,255,.05);
      border:1px solid var(--border); border-radius:4px;
      padding:10px 12px; color:var(--text); font-family:'Barlow',sans-serif;
      font-size:14px; outline:none; margin-bottom:8px; text-align:center;
      letter-spacing:2px;
    }
    .ppwd-err, .login-err { font-size:12px; color:var(--red); min-height:14px; margin-bottom:8px; font-family:'Barlow Condensed',sans-serif; letter-spacing:1px; text-transform:uppercase; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
    .pwd-shake { animation:shake .4s ease; }

    /* Toast */
    .toast {
      position:fixed; bottom:24px; left:50%;
      transform:translateX(-50%) translateY(80px);
      background:#4ADE80; color:#000;
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:13px; letter-spacing:2px; text-transform:uppercase;
      padding:12px 24px; border-radius:4px; transition:transform .3s; z-index:9999;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* Admin panel top */
    .admin-top { display:flex; align-items:center; justify-content:space-between; padding:20px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px; }
    .admin-top h2 { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; }
    .admin-top h2 span { color:var(--red); }
    .admin-top-right { display:flex; align-items:center; gap:10px; }

    /* Reveal */
    .reveal { opacity:0; transform:translateY(24px); transition:opacity .6s ease,transform .6s ease; }
    .reveal.visible { opacity:1; transform:none; }

    /* ── RESPONSIVE ── */
    @media(max-width:700px) {
      /* El bracket completo pasa a un scroll horizontal "tipo carrusel" con
         columnas más anchas (220px) para que el nombre completo del equipo
         entre sin truncarse. Se quita la grilla de 9 columnas y se usa flex
         con anchos fijos, manteniendo el orden QF-SF-FINAL-SF-QF. */
      .bracket-page { padding: 30px 0 50px; }

      .bracket-rounds-header,
      .bracket-wrap {
        display: flex !important;
        grid-template-columns: none !important;
        width: max-content;
        min-width: 100%;
        padding-left: 14px;
        padding-right: 14px;
      }
      .bracket-legend { margin-left:14px; margin-right:14px; }

      .round-label {
        width: 220px;
        min-width: 220px;
        flex: none;
      }
      .connector-col {
        width: 16px;
        min-width: 16px;
      }
      .bracket-rounds-header > div:empty {
        width: 16px;
        min-width: 16px;
        flex: none;
      }
      .bracket-col {
        width: 220px;
        min-width: 220px;
        flex: none;
        scroll-snap-align: start;
      }

      .matchup { margin: 0 2px; }
      .team-seed { width: 18px; font-size: 10px; }
      .team-logo-sm { width: 22px; height: 22px; margin: 0 5px; }
      .team-name-bracket {
        font-size: 12px;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        line-height: 1.15;
        padding: 4px 6px 4px 0;
        word-break: break-word;
      }
      .team-score-bracket { width: 26px; font-size: 17px; }
      .winner-check { width:14px; height:14px; margin-right:4px; }

      .champion-card { min-width: 190px; }

      .padmin-grid { grid-template-columns:1fr; }
      .nav-logo { font-size:17px; }
      .games-grid { grid-template-columns:1fr; }
      .form-row { grid-template-columns:1fr; }
      .game-admin-item { flex-direction:column; align-items:flex-start; }
      .padmin-tabs { overflow-x:auto; }
    }

    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation:fadeUp .5s ease both; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ══ NAV ══ -->
<nav>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const CONFIG = {
  divisions: {
    primera: {
      label: 'Primera División', dbTable: 'games',
      teams: {
        EXMAN: { abbr:'EX-MAN', name:'EX-Manquehue',          color:'#1E3A8A', logo:'logos/exman.png' },
        ANANA: { abbr:'ORTHO',  name:'Orthobullets',                  color:'#7A1F3D', logo:'logos/anana.png' },
        OLDDS: { abbr:'OLD-DS', name:'Old-DS',                 color:'#8A6D3B', logo:'logos/ols ds.png' },
        INGUC: { abbr:'INGUC',  name:'Ingeniería UC',          color:'#FACC15', logo:'logos/ing.png' },
        TRO:   { abbr:'TRO',    name:'Tropics',                color:'#F97316', logo:'logos/trop.png' },
        SWD:   { abbr:'RAYO',    name:'Rayo Malayo', color:'#B8860B', logo:'logos/rayo.png' },
        SAL:   { abbr:'SAL',    name:'Salitre',                color:'#D4A017', logo:'logos/salitre.png' },
        BAR:   { abbr:'EX-ABC',    name:'Ex-ABC',     color:'#1D4ED8', logo:'logos/abc.png' },
        T2A:   { abbr:'BRE',    name:'Brillante Resplandor',   color:'#F59E0B', logo:'logos/brillante.png' },
      },
    },
    segunda: {
      label: 'Segunda División', dbTable: 'games_segunda',
      teams: {
        T2B: { abbr:'DYN',  name:'Dynamos',              color:'#7C1D1D', logo:'logos/dynamos.png' },
        T2C: { abbr:'DER',  name:'Derazzo',              color:'#B33A3A', logo:'logos/derazzo.png' },
        T2D: { abbr:'JUA',  name:'Juanitos',            color:'#D93A0F', logo:'logos/juanitos.png' },
        T2E: { abbr:'NAN',  name:'Nanami',         color:'#EC4899', logo:'logos/nanami.png' },
        T2F: { abbr:'CSQ',  name:'Cusqueños',            color:'#C9A227', logo:'logos/cusquenos.png' },
        T2G: { abbr:'PIS',  name:'Piscoliers',           color:'#6B2426', logo:'logos/piscoliers.png' },
        T2H: { abbr:'CHC',  name:'Chat HC',              color:'#16A34A', logo:'logos/chat.png' },
        T2I: { abbr:'PRO', name:'Provilocura',              color:'#0D9488', logo:'logos/provilocura.png' },
        T2J: { abbr:'RIM',  name:'Rimbreakers',              color:'#C1440E', logo:'logos/rimbreakers.png' },
      },
    },
  },
};

const SUPABASE_URL = 'https://shresvpjavpxdosdtjfh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNocmVzdnBqYXZweGRvc2R0amZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUwOTQ3ODMsImV4cCI6MjA5MDY3MDc4M30.eBZNEhkNZFltKepiGttzyr-GVkG1mGT9rn6GEyNecdA';
const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── State ── */
let activeDivision = 'primera';
let divData        = {};   // { primera: { games, bracket, projected, stats }, ... }
let activeGamesFilter = 'all';

const divCfg   = () => CONFIG.divisions[activeDivision];
const divTeams = () => divCfg().teams;

/* ── Estructura del cuadro (mismas llaves que supabase/playoffs.sql) ── */
const BRACKET_STRUCTURE = [
  { id:'QF1', round:'QF', label:'Cuartos de Final 1' },
  { id:'QF2', round:'QF', label:'Cuartos de Final 2' },
  { id:'QF3', round:'QF', label:'Cuartos de Final 3' },
  { id:'QF4', round:'QF', label:'Cuartos de Final 4' },
  { id:'SF1', round:'SF', label:'Semifinal 1' },
  { id:'SF2', round:'SF', label:'Semifinal 2' },
  { id:'F1',  round:'F',  label:'Gran Final' },
];

/* ═══ LOAD ═══
   Los playoffs son partidos de games / games_segunda con bracket_slot.
   Mientras no se confirmen los cruces, el cuadro es una proyección
   según la tabla actual de la fase regular. */
async function loadDivision(div) {
  const cfg = CONFIG.divisions[div];
  const { data } = await _sb.from(cfg.dbTable).select('*').order('round').order('id');
  const games = data || [];
  const playoffs = games.filter(g => g.bracket_slot && g.type !== 'scheduled');
  const confirmed = games.some(g => g.bracket_slot);

  let bracket;
  if (confirmed) {
    bracket = BRACKET_STRUCTURE.map(m => {
      const g = games.find(x => x.bracket_slot === m.id);
      if (!g) return { ...m, team1: null, team2: null, score1: null, score2: null, winner: null, seeds: [] };
      const played = g.type === 'finished' || g.type === 'live';
      return {
        ...m, gameId: g.type === 'scheduled' ? null : g.id, live: g.type === 'live',
        team1: g.home, team2: g.away, seeds: [g.home_seed, g.away_seed],
        score1: played ? g.home_score : null, score2: played ? g.away_score : null,
        winner: g.type === 'finished' ? (+g.home_score > +g.away_score ? g.home : g.away) : null,
      };
    });
  } else {
    const table = regularStandings(games, Object.keys(cfg.teams));
    const anyPlayed = table.some(r => r.gp > 0);
    const qf = anyPlayed ? quarterFinalsFrom(table) : [];
    bracket = BRACKET_STRUCTURE.map(m => {
      const q = qf.find(x => x.slot === m.id);
      return { ...m, team1: q?.home.teamId || null, team2: q?.away.teamId || null,
               seeds: q ? [q.homeSeed, q.awaySeed] : [], score1: null, score2: null, winner: null };
    });
  }

  const regular = games.filter(g => !isPlayoff(g));
  const pendingRounds = new Set(regular.filter(g => g.type !== 'finished').map(g => g.round)).size;

  let stats = [];
  const ids = playoffs.filter(g => g.type !== 'upcoming').map(g => g.id);
  if (ids.length) {
    const { data: st } = await _sb.from('game_stats').select('*').eq('division', div).in('game_id', ids);
    stats = st || [];
  }
  divData[div] = { games, playoffs, bracket, projected: !confirmed, pendingRounds, stats };
}

/* ═══ SWITCH DIV ═══ */
async function switchDiv(div) {
  activeDivision = div;
  activeGamesFilter = 'all';

  document.getElementById('tab-btn-primera').classList.toggle('active', div === 'primera');
  document.getElementById('tab-btn-segunda').classList.toggle('active', div === 'segunda');

  const hero = document.getElementById('playoff-hero');
  hero.classList.toggle('segunda-active', div === 'segunda');
  document.getElementById('hero-div-sub').textContent = divCfg().label;
  document.getElementById('hero-accent').style.color = div === 'primera' ? 'var(--red)' : '#4e7fff';
  document.getElementById('games-section-tag').textContent = `Playoffs 2026 · ${divCfg().label}`;

  document.getElementById('bracket-container').innerHTML =
    '<p style="text-align:center;padding:60px;color:var(--muted);font-family:\'Barlow Condensed\',sans-serif;letter-spacing:2px;text-transform:uppercase;">Cargando...</p>';
  document.getElementById('playoff-games-grid').innerHTML =
    '<div class="games-empty">Cargando partidos...</div>';

  if (!divData[div]) await loadDivision(div);

  renderBracket();
  renderPlayoffGames();
  renderScorers();
  updateStatus();
  setTimeout(activateReveal, 80);
}

/* ═══ STATUS ═══ */
function updateStatus() {
  const d = divData[activeDivision]; if (!d) return;
  const finalMatch = d.bracket.find(m => m.id === 'F1');
  const pill = document.getElementById('status-pill');
  const txt  = document.getElementById('status-text');
  const banner = document.getElementById('projection-banner');
  document.getElementById('bracket-container').classList.toggle('projected', d.projected);

  banner.hidden = !d.projected;
  if (d.projected) {
    banner.innerHTML = d.bracket.some(m => m.team1)
      ? (d.pendingRounds
          ? `<strong>📊 Proyección</strong> · Así serían los cruces si la fase regular terminara hoy. Se actualiza con cada resultado; ${d.pendingRounds === 1 ? 'queda 1 jornada' : `quedan ${d.pendingRounds} jornadas`}.`
          : `<strong>Fase regular terminada</strong> · Estos son los cruces según la tabla final; falta que la organización los confirme.`)
      : '<strong>📊 Proyección</strong> · Los cruces aparecerán cuando se jueguen los primeros partidos.';
  }

  if (finalMatch && finalMatch.winner) {
    pill.className = 'playoff-status-pill pill-active';
    const t = divTeams()[finalMatch.winner];
    txt.textContent = `🏆 Campeón: ${t ? t.name : finalMatch.winner}`;
  } else if (!d.projected) {
    pill.className = 'playoff-status-pill pill-active';
    txt.textContent = d.playoffs.length ? 'Playoffs en curso' : 'Cruces confirmados';
  } else {
    pill.className = 'playoff-status-pill pill-pending';
    txt.textContent = d.pendingRounds ? 'Fase regular en curso' : 'Fase regular terminada';
  }
}

/* ═══ BRACKET RENDER ═══ */
function teamLogoSmall(teamId) {
  const t = divTeams()[teamId];
  if (!t) return '<div style="width:28px;height:28px;"></div>';
  if (t.logo) return `<div class="team-logo-sm"><img src="${t.logo}" alt="${t.abbr}" onerror="this.onerror=null;this.style.display='none'"></div>`;
  return `<div class="team-logo-sm"><div class="team-logo-placeholder" style="background:${t.color}">${t.abbr.slice(0,3)}</div></div>`;
}

function renderMatchup(m, cls = '') {
  const teams = divTeams();
  const renderTeamRow = (teamId, score, isWinner, seed) => {
    const t = teams[teamId];
    const rowCls = !teamId ? 'tbd' : isWinner ? 'winner' : (m.winner ? 'loser' : '');
    const name = t ? t.name : (teamId ? teamId : 'Por definir');
    const scoreVal = score !== null && score !== undefined ? score : '-';
    const check = isWinner ? '<div class="winner-check">✓</div>' : '<div style="width:22px;flex-shrink:0;"></div>';
    return `<div class="team-row ${rowCls}">
      <div class="team-seed">${seed || '·'}</div>
      ${teamId ? teamLogoSmall(teamId) : '<div style="width:28px;height:28px;margin:0 6px;"></div>'}
      <div class="team-name-bracket" title="${name}">${name}</div>
      ${check}
      <div class="team-score-bracket">${scoreVal}</div>
    </div>`;
  };
  const isFinal = m.id === 'F1';
  const isSF    = m.round === 'SF';
  const cardCls = isFinal ? 'final champion-match' : isSF ? 'semifinal' : '';
  const tag = m.gameId ? 'a' : 'div';
  const href = m.gameId ? ` href="partido.html?div=${activeDivision}&id=${m.gameId}"` : '';
  return `<${tag}${href} class="matchup ${cardCls} ${cls}">
    <div class="matchup-round-tag">${m.label}${m.live ? '<span class="matchup-live">● En vivo</span>' : ''}</div>
    ${renderTeamRow(m.team1, m.score1, !!m.winner && m.winner === m.team1, m.seeds?.[0])}
    ${renderTeamRow(m.team2, m.score2, !!m.winner && m.winner === m.team2, m.seeds?.[1])}
  </${tag}>`;
}

function renderBracket() {
  const data = divData[activeDivision]?.bracket; if (!data) return;
  const teams = divTeams();
  const qf = data.filter(m => m.round === 'QF');
  const sf = data.filter(m => m.round === 'SF');
  const f  = data.find(m => m.round === 'F');
  const finalWinner = f && f.winner ? teams[f.winner] : null;

  // Column order: QF-L | gap | SF-L | gap | FINAL | gap | SF-R | gap | QF-R
  // Header uses same 9-column grid so labels sit above correct columns
  document.getElementById('bracket-container').innerHTML = `
    <div class="bracket-rounds-header" style="display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr 28px 1fr;margin-bottom:20px;padding:0 4px;">
      <div class="round-label">Cuartos de Final</div>
      <div></div>
      <div class="round-label">Semifinales</div>
      <div></div>
      <div class="round-label champion">Final</div>
      <div></div>
      <div class="round-label">Semifinales</div>
      <div></div>
      <div class="round-label">Cuartos de Final</div>
    </div>

    <div class="bracket-wrap" id="bracket-wrap" style="display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr 28px 1fr;align-items:stretch;min-height:420px;">

      <!-- QF izquierda: QF1 arriba, QF2 abajo -->
      <div class="bracket-col" style="display:flex;flex-direction:column;">
        <div class="bracket-spacer"></div>
        ${qf[0] ? renderMatchup(qf[0]) : ''}
        <div style="flex:1;min-height:24px;"></div>
        ${qf[1] ? renderMatchup(qf[1]) : ''}
        <div class="bracket-spacer"></div>
      </div>

      <!-- Conector QF-L → SF-L -->
      <div class="connector-col"></div>

      <!-- SF izquierda: SF1 centrado -->
      <div class="bracket-col" style="display:flex;flex-direction:column;">
        <div class="bracket-spacer"></div>
        ${sf[0] ? renderMatchup(sf[0]) : ''}
        <div class="bracket-spacer"></div>
      </div>

      <!-- Conector SF-L → Final -->
      <div class="connector-col"></div>

      <!-- FINAL + Campeón -->
      <div class="bracket-col" style="display:flex;flex-direction:column;min-width:160px;">
        <div class="bracket-spacer"></div>
        ${f ? renderMatchup(f) : ''}
        <div class="champion-wrap" style="margin-top:12px;">
          <div class="champion-card">
            <div class="champion-trophy">🏆</div>
            <div class="champion-label">Campeón</div>
            ${finalWinner
              ? `<div class="champion-logo">${finalWinner.logo
                  ? `<img src="${finalWinner.logo}" alt="${finalWinner.name}">`
                  : `<div class="champion-logo-placeholder" style="background:${finalWinner.color}">${finalWinner.abbr}</div>`
                }</div><div class="champion-name">${finalWinner.name}</div>`
              : '<div class="champion-tbd">Por definir</div>'
            }
          </div>
        </div>
        <div class="bracket-spacer"></div>
      </div>

      <!-- Conector Final → SF-R -->
      <div class="connector-col"></div>

      <!-- SF derecha: SF2 centrado -->
      <div class="bracket-col" style="display:flex;flex-direction:column;">
        <div class="bracket-spacer"></div>
        ${sf[1] ? renderMatchup(sf[1]) : ''}
        <div class="bracket-spacer"></div>
      </div>

      <!-- Conector SF-R → QF-R -->
      <div class="connector-col"></div>

      <!-- QF derecha: QF3 arriba, QF4 abajo -->
      <div class="bracket-col" style="display:flex;flex-direction:column;">
        <div class="bracket-spacer"></div>
        ${qf[2] ? renderMatchup(qf[2]) : ''}
        <div style="flex:1;min-height:24px;"></div>
        ${qf[3] ? renderMatchup(qf[3]) : ''}
        <div class="bracket-spacer"></div>
      </div>

    </div>

    <div class="bracket-legend">
      <div class="legend-item"><span class="legend-dot" style="background:#4ADE80;"></span>Ganador</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--gold);"></span>Líder de llave</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--red);opacity:.5;"></span>Semifinalista</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--gold);opacity:.8;"></span>Finalista</div>
    </div>`;
}

/* ═══ PLAYOFF GAMES RENDER ═══ */
function setGamesFilter(f) {
  activeGamesFilter = f;
  document.querySelectorAll('#games-filter .filter-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['all','upcoming','finished'][i] === f);
  });
  renderPlayoffGames();
  setTimeout(activateReveal, 60);
}

function renderPlayoffGames() {
  const teams   = divTeams();
  const all = (divData[activeDivision]?.playoffs || []).map(r => ({
    id: r.id, type: r.type, round: roundName(r), date: r.date || 'Por definir',
    home: r.home, away: r.away, venue: r.venue || 'Colegio Cumbres',
    homeScore: r.home_score ?? 0, awayScore: r.away_score ?? 0, mvp: r.mvp || '',
  }));
  const finished = all.filter(g => g.type === 'finished');
  const upcoming = all.filter(g => g.type === 'upcoming' || g.type === 'live');

  let list;
  if      (activeGamesFilter === 'finished') list = finished;
  else if (activeGamesFilter === 'upcoming') list = upcoming;
  else list = [...upcoming, ...finished.slice().reverse()];

  // update filter counts
  const filterBtns = document.querySelectorAll('#games-filter .filter-btn');
  if (filterBtns[0]) filterBtns[0].textContent = 'Todos';
  if (filterBtns[1]) filterBtns[1].textContent = `Próximos (${upcoming.length})`;
  if (filterBtns[2]) filterBtns[2].textContent = `Resultados (${finished.length})`;

  if (!list.length) {
    document.getElementById('playoff-games-grid').innerHTML = all.length
      ? '<div class="games-empty">No hay partidos en esta categoría.</div>'
      : '<div class="games-empty">Los partidos aparecerán cuando se publiquen los cuartos de final.</div>';
    return;
  }

  const cards = list.map(g => {
    const home = teams[g.home], away = teams[g.away];
    if (!home || !away) return '';

    const homeLogo = home.logo
      ? `<div class="ts-logo-sm"><img src="${home.logo}" alt="${home.abbr}" onerror="this.onerror=null;this.style.display='none'"></div>`
      : `<div class="ts-logo-sm"><div style="width:34px;height:34px;border-radius:50%;background:${home.color};display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:10px;color:#fff;">${home.abbr}</div></div>`;
    const awayLogo = away.logo
      ? `<div class="ts-logo-sm"><img src="${away.logo}" alt="${away.abbr}" onerror="this.onerror=null;this.style.display='none'"></div>`
      : `<div class="ts-logo-sm"><div style="width:34px;height:34px;border-radius:50%;background:${away.color};display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:10px;color:#fff;">${away.abbr}</div></div>`;

    if (g.type === 'upcoming' || g.type === 'live') {
      return `<a href="partido.html?div=${activeDivision}&id=${g.id}" class="game-card upcoming reveal" style="display:block;color:inherit;text-decoration:none;">
        <div class="game-card-header">
          <span class="game-round-tag">${g.type === 'live' ? '<span style="color:var(--red)">● EN VIVO</span> · ' : '🏆 '}${g.round}</span>
          <span class="game-date-tag">${g.date}</span>
        </div>
        <div class="game-body">
          <div class="team-score-row">
            <div class="ts-info">${homeLogo}<div class="ts-name">${home.name}</div></div>
            <div class="vs-label">VS</div>
          </div>
          <div class="team-score-row">
            <div class="ts-info">${awayLogo}<div class="ts-name">${away.name}</div></div>
          </div>
        </div>
        <div class="game-footer">
          <span>🏟️ ${g.venue}</span>
          <span style="color:var(--gold);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;">${g.type === 'live' ? `${g.homeScore}–${g.awayScore} · Ver en vivo →` : `📅 ${g.date}`}</span>
        </div>
      </a>`;
    }

    const homeWon = +g.homeScore > +g.awayScore;
    return `<a href="partido.html?div=${activeDivision}&id=${g.id}" class="game-card finished reveal" style="display:block;color:inherit;text-decoration:none;">
      <div class="game-card-header">
        <span class="game-round-tag">✓ ${g.round}</span>
        <span class="game-date-tag">${g.date}</span>
      </div>
      <div class="game-body">
        <div class="team-score-row">
          <div class="ts-info">${homeLogo}<div class="ts-name">${home.name}</div></div>
          <div class="ts-score-pl ${homeWon ? 'winner' : 'loser'}">${g.homeScore}</div>
        </div>
        <div class="team-score-row">
          <div class="ts-info">${awayLogo}<div class="ts-name">${away.name}</div></div>
          <div class="ts-score-pl ${homeWon ? 'loser' : 'winner'}">${g.awayScore}</div>
        </div>
      </div>
      <div class="game-footer">
        <span>🏟️ ${g.venue}</span>
        ${g.mvp ? `<span class="mvp-tag">⭐ ${g.mvp}</span>` : ''}
      </div>
    </a>`;
  }).join('');

  document.getElementById('playoff-games-grid').innerHTML = cards ||
    '<div class="games-empty">No hay partidos en esta categoría.</div>';
}

/* ═══ ANOTADORES DE PLAYOFFS (game_stats de partidos de playoffs) ═══ */
function renderScorers() {
  const d = divData[activeDivision]; const teams = divTeams();
  const el = document.getElementById('playoff-scorers');
  const byPlayer = {};
  (d?.stats || []).forEach(s => {
    if (!(s.points > 0 || s.played)) return;
    const key = s.player_id ?? `${s.team}:${s.player_name}`;
    const p = byPlayer[key] ||= { id: s.player_id, name: s.player_name, team: s.team, pts: 0, games: new Set() };
    p.pts += s.points || 0; p.games.add(s.game_id);
  });
  const rows = Object.values(byPlayer).filter(p => p.pts > 0)
    .sort((a, b) => b.pts - a.pts || a.games.size - b.games.size).slice(0, 10);
  if (!rows.length) {
    el.innerHTML = '<div class="games-empty">Los anotadores aparecerán cuando se juegue el primer partido de playoffs.</div>';
    return;
  }
  el.innerHTML = `<div class="po-scorers reveal">
    <div class="po-scorer head"><span class="rank">#</span><span>Jugador</span><span class="num">PJ</span><span class="num">PTS</span><span class="num">PPG</span></div>
    ${rows.map((p, i) => `<div class="po-scorer">
      <span class="rank">${i + 1}</span>
      <span class="who">${teamLogoSmall(p.team)}<span>${p.id ? `<a href="player.html?id=${p.id}&div=${activeDivision}" style="color:inherit;text-decoration:none;">${p.name}</a>` : p.name}<small>${teams[p.team]?.name || p.team}</small></span></span>
      <span class="num">${p.games.size}</span>
      <span class="pts">${p.pts}</span>
      <span class="num">${(p.pts / p.games.size).toFixed(1)}</span>
    </div>`).join('')}
  </div>`;
}

/* ── Helpers ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function activateReveal() {
  const io = new IntersectionObserver(entries => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) {
        e.target.style.transitionDelay = (i % 4) * 80 + 'ms';
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: .08 });
  document.querySelectorAll('.reveal:not(.visible)').forEach(r => io.observe(r));
}

/* ═══ INIT ═══ */
(async () => {
  const div = sessionStorage.getItem('activeDivision') === 'segunda' ? 'segunda' : 'primera';
  await switchDiv(div);
})();
</script>
